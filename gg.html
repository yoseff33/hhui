<!-- بانر توضيحي يظهر للعميل أول ما يدخل موقعك من الآيفون -->
<div id="ios-install-banner" style="display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #1e293b; color: #fff; padding: 20px; text-align: center; border-top-left-radius: 16px; border-top-right-radius: 16px; box-shadow: 0 -5px 25px rgba(0,0,0,0.5); z-index: 9999; font-family: system-ui;">
    <p style="margin: 0 0 10px 0; font-size: 16px; font-weight: bold;">🔔 تبي يجيك إشعار أول ما يجهز طلبك؟</p>
    <p style="margin: 0 0 15px 0; font-size: 13px; color: #94a3b8;">اضغط على زر المشاركة بالأسفل <span style="font-size: 18px; animation: bounce 1s infinite; display: inline-block;">👇</span> ثم اختر <b>"إضافة إلى الشاشة الرئيسية"</b></p>
    <button onclick="closeBanner()" style="background: #334155; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer;">حسناً، فهمت</button>
</div>

<style>
@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(6px); }
}
</style>

<script>
    // إظهار البانر فقط إذا كان المستخدم يفتح الموقع من الآيفون ولم يقم بتثبيته مسبقاً
    const isIos = /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
    const isInStandaloneMode = ('standalone' in window.navigator) && (window.navigator.standalone);

    if (isIos && !isInStandaloneMode) {
        document.getElementById('ios-install-banner').style.display = 'block';
    }

    function closeBanner() {
        document.getElementById('ios-install-banner').style.display = 'none';
    }
</script>
