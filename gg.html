<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تجربة التنبيه بعد دقيقة</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2563eb;
        }
        #status {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>اختبار التنبيه بعد دقيقة</h2>
        <p>اضغط الزر وابقى في الصفحة، سيتم تشغيل نغمة وإشعار بعد 60 ثانية بالضبط.</p>
        <button onclick="startTimer()">بدء المؤقت (دقيقة واحدة)</button>
        <div id="status">الحالة: جاهز للبدء</div>
    </div>

    <script>
        // دالة لتوليد صوت تنبيه (نغمة بيبي) عبر تقنية الـ Web Audio API دون الحاجة لملف صوت خارجي
        function playBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(587.33, audioCtx.currentTime); // نغمة D5
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5); // مدة الصوت نصف ثانية
            } catch (e) {
                console.log("الصوت يحتاج تفاعل مستخدم مسبق");
            }
        }

        function startTimer() {
            const statusDiv = document.getElementById("status");
            statusDiv.textContent = "الحالة: تم البدء، انتظر دقيقة...";

            // طلب إذن الإشعارات إذا لم يُطلب مسبقاً
            if (Notification.permission !== "granted") {
                Notification.requestPermission();
            }

            // ضبط المؤقت على 60 ثانية (60000 مللي ثانية)
            setTimeout(() => {
                statusDiv.textContent = "الحالة: انتهى الوقت! 🚨";
                
                // 1. تشغيل الصوت
                playBeep();

                // 2. محاولة إرسال إشعار المتصفح
                if (Notification.permission === "granted") {
                    new Notification("تنبيه طلبك!", {
                        body: "مرت دقيقة كاملة، هذا إشعار تجريبي من الصفحة.",
                        icon: "https://cdn-icons-png.flaticon.com/512/1827/1827393.png"
                    });
                }
            }, 60000); // 60,000 ms = 1 minute
        }
    </script>

</body>
</html>
