<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤقت الطلبات وتنبيهات المتجر</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            text-align: center;
            max-width: 380px;
            width: 100%;
        }
        input, button {
            width: 100%;
            padding: 0.75rem;
            margin-top: 1rem;
            font-size: 1rem;
            border-radius: 0.5rem;
            border: none;
            box-sizing: border-box;
        }
        input {
            background-color: #334155;
            color: white;
            text-align: center;
        }
        .btn-primary {
            background-color: #3b82f6;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-primary:hover {
            background-color: #2563eb;
        }
        #countdown-display {
            font-size: 3rem;
            font-weight: bold;
            margin: 1.5rem 0;
            color: #38bdf8;
        }
        #status {
            font-size: 0.9rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>مؤقت تتبع الطلب التجريبي</h2>
        <p>حدد عدد الثواني لاختبار التنبيه والصوت:</p>
        
        <input type="number" id="secondsInput" value="10" min="1" max="300" placeholder="أدخل عدد الثواني">
        <button class="btn-primary" onclick="startCustomTimer()">بدء المؤقت</button>

        <div id="countdown-display">00:00</div>
        <div id="status">جاهز للاستخدام</div>
    </div>

    <!-- عنصر الصوت المخفي للتنبيه -->
    <audio id="myAudio" preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
    </audio>
