<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Vibes | فايبز كافيه</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <style>
        :root {
            --brown: #795239;
            --dark: #2d1f16;
            --cream: #f6f2ed;
            --beige: #eadfd4;
            --white: #fff;
            --green: #267447;
            --red: #b42318;
            --muted: #74675f;
            --shadow: 0 12px 35px #3b251315;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--cream);
            color: var(--dark);
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            padding-bottom: 95px;
            -webkit-tap-highlight-color: transparent;
        }
        button, input, textarea, select { font: inherit; }
        button, a { cursor: pointer; }

        .svg-icon {
            width: 17px;
            height: 17px;
            fill: currentColor;
            display: inline-block;
            vertical-align: middle;
        }

        .hero {
            text-align: center;
            background: var(--white);
            padding: 26px 16px 20px;
            position: relative;
            border-bottom: 1px solid #0000000b;
        }
        .logo-wrap {
            width: 60px;
            height: 60px;
            margin: 0 auto 8px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: var(--brown);
            color: var(--white);
            overflow: hidden;
            border: 2px solid var(--beige);
        }
        .logo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .logo-letter {
            font-size: 28px;
            font-weight: 900;
            color: var(--white);
        }
        .hero h1 {
            letter-spacing: 4px;
            color: var(--brown);
            margin: 6px 0 2px;
            font-size: 24px;
            font-weight: 800;
        }
        .hero p {
            margin: 0 0 10px;
            color: var(--muted);
            font-size: 13px;
        }
        .admin-link {
            position: absolute;
            left: 18px;
            top: 18px;
            color: var(--brown);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        .social-btn {
            background: var(--cream);
            border: 1px solid var(--beige);
            color: var(--dark);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            transition: 0.2s;
        }
        .social-btn:hover {
            background: var(--brown);
            color: var(--white);
            border-color: var(--brown);
        }

        .container {
            max-width: 1050px;
            margin: auto;
            padding: 16px;
        }

        /* Stories Bar */
        .stories-wrapper {
            padding: 10px 0 14px;
            overflow-x: auto;
            display: flex;
            gap: 14px;
            scrollbar-width: none;
        }
        .stories-wrapper::-webkit-scrollbar { display: none; }
        .story-circle-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
            width: 68px;
        }
        .story-ring {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(45deg, var(--brown), #b48564, var(--dark));
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .story-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--white);
        }
        .story-title {
            font-size: 11px;
            margin-top: 5px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            color: var(--dark);
            font-weight: 600;
        }

        /* Category Chips */
        .chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 6px 0 16px;
            scrollbar-width: none;
        }
        .chips::-webkit-scrollbar { display: none; }
        .chips button {
            border: 0;
            border-radius: 20px;
            padding: 8px 18px;
            background: var(--beige);
            color: var(--dark);
            white-space: nowrap;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s;
        }
        .chips button.active {
            background: var(--brown);
            color: var(--white);
        }

        /* Products Grid */
        .products {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }
        @media(min-width: 720px) {
            .products { grid-template-columns: repeat(4, 1fr); }
        }
        .product {
            background: var(--white);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 3px 13px #0000000c;
            position: relative;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.15s;
        }
        .product:active { transform: scale(0.98); }
        .product img, .image-placeholder {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            background: var(--beige);
            display: grid;
            place-items: center;
            color: var(--brown);
        }
        .product-content {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .product h3 {
            font-size: 15px;
            margin: 0;
            font-weight: 700;
        }
        .product p {
            font-size: 12px;
            color: var(--muted);
            margin: 4px 0 10px;
            min-height: 34px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }
        .product-bottom {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .price {
            color: var(--brown);
            font-weight: 900;
            font-size: 15px;
        }
        .add {
            position: absolute;
            left: 10px;
            bottom: 10px;
            border: 0;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            background: var(--brown);
            color: var(--white);
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #fff4d6;
            color: var(--dark);
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
        }

        /* Cart Floating Button */
        .cart-fab {
            position: fixed;
            z-index: 20;
            bottom: 18px;
            right: 50%;
            transform: translateX(50%);
            width: min(92%, 550px);
            border: 0;
            border-radius: 18px;
            background: var(--dark);
            color: var(--white);
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            font-size: 14px;
            font-weight: 700;
        }
        .cart-fab.hidden { display: none !important; }
        .cart-fab-badge {
            background: var(--brown);
            color: var(--white);
            padding: 3px 9px;
            border-radius: 12px;
            font-size: 12px;
        }

        /* Modals & Dialogs */
        dialog {
            border: 0;
            box-shadow: var(--shadow);
            width: min(100%, 540px);
            max-height: 90vh;
            overflow-y: auto;
            padding: 22px;
            border-radius: 24px;
            background: var(--white);
            color: var(--dark);
            margin: auto;
        }
        dialog::backdrop {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(3px);
        }
        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .modal-head h2 { margin: 0; font-size: 17px; color: var(--dark); }
        .close {
            border: 0;
            background: var(--cream);
            color: var(--dark);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            display: grid;
            place-items: center;
        }
        .detail-img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 12px;
            background: var(--beige);
        }
        .input-group { margin-bottom: 12px; }
        .input-group label {
            display: block;
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 5px;
            color: var(--dark);
        }
        .input-group input, .input-group textarea, .input-group select {
            display: block;
            width: 100%;
            padding: 11px;
            border: 1px solid #d7c8bd;
            border-radius: 10px;
            background: #fff;
            color: var(--dark);
            font-size: 14px;
        }

        .order-types {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 14px;
        }
        .order-type-btn {
            background: var(--cream);
            border: 1px solid var(--beige);
            color: var(--muted);
            padding: 10px 4px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
        }
        .order-type-btn.active {
            background: var(--brown);
            color: var(--white);
            border-color: var(--brown);
        }
        .order-type-btn.active .svg-icon { fill: var(--white); }

        .primary {
            background: var(--brown);
            color: var(--white);
            border: 0;
            border-radius: 12px;
            padding: 13px;
            font-size: 15px;
            font-weight: 800;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .secondary {
            background: var(--beige);
            color: var(--dark);
            border: 0;
            border-radius: 10px;
            padding: 8px 14px;
            font-weight: 600;
        }

        .saved-customer-badge {
            background: #eef7f0;
            color: var(--green);
            padding: 9px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Stories Viewer with Tap Controls */
        #storyViewer {
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            background: #000;
            padding: 0;
            position: relative;
            border-radius: 0;
        }
        .story-progress-bar {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            height: 3px;
            background: rgba(255,255,255,0.25);
            border-radius: 3px;
            z-index: 20;
            overflow: hidden;
        }
        .story-progress-fill {
            height: 100%;
            width: 0%;
            background: #fff;
            transition: width 0.1s linear;
        }
        .story-tap-area {
            position: absolute;
            top: 40px;
            bottom: 90px;
            width: 50%;
            z-index: 15;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        #storyTapLeft { left: 0; }
        #storyTapRight { right: 0; }

        .story-viewer-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .story-viewer-info {
            position: absolute;
            bottom: 30px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.65);
            padding: 16px;
            border-radius: 14px;
            backdrop-filter: blur(8px);
            z-index: 20;
            color: #fff;
        }
        .story-viewer-close {
            position: absolute;
            top: 25px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            color: #fff;
            border: 0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            z-index: 30;
        }

        .toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            background: var(--dark);
            color: #fff;
            padding: 10px 18px;
            border-radius: 10px;
            opacity: 0;
            pointer-events: none;
            transition: .25s;
            z-index: 50;
            font-size: 13px;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <header class="hero">

        <div class="logo-wrap" id="brandLogoContainer">
            <span class="logo-letter" id="brandLetter">V</span>
        </div>
        <h1 id="storeNameHeader">VIBES</h1>
        <p id="storeDesc">Specialty Coffee & Sweets</p>

        <!-- Social Media & Maps -->
        <div class="social-links">
            <a href="#" target="_blank" id="instagramLink" class="social-btn">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                <span>Instagram</span>
            </a>
            <a href="#" target="_blank" id="tiktokLink" class="social-btn">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.24 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>
                <span>TikTok</span>
            </a>
            <a href="#" target="_blank" id="mapsLink" class="social-btn" style="display:none;">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 0c-4.198 0-8 3.403-8 7.602 0 4.198 3.469 9.21 8 16.398 5.688-9.06 8-12.2 8-16.398 0-4.199-3.801-7.602-8-7.602zm0 11c-1.657 0-3-1.343-3-3s1.343-3 3-3 3 1.343 3 3-1.343 3-3 3z"/></svg>
                <span>الموقع</span>
            </a>
        </div>
    </header>

    <div class="container">
        <!-- Stories Bar -->
        <div class="stories-wrapper" id="storiesContainer"></div>

        <!-- Filter Chips -->
        <div class="chips" id="filterChips">
            <button class="active" data-category="all">الكل</button>
            <button data-category="coffee">قهوة</button>
            <button data-category="cold">مشروبات باردة</button>
            <button data-category="sweets">حلويات</button>
            <button data-category="other">أخرى</button>
        </div>

        <!-- Products -->
        <div class="products" id="productList"></div>
    </div>

    <!-- Floating Cart Button -->
    <button class="cart-fab hidden" id="cartFab">
        <div style="display:flex;align-items:center;gap:10px;">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M10 19.5c0 .829-.672 1.5-1.5 1.5s-1.5-.671-1.5-1.5c0-.828.672-1.5 1.5-1.5s1.5.672 1.5 1.5zm3.5-1.5c-.828 0-1.5.671-1.5 1.5s.672 1.5 1.5 1.5 1.5-.671 1.5-1.5c0-.828-.672-1.5-1.5-1.5zm1.336-5l1.977-7h-16.813l2.938 7h11.898zm4.969-10l-3.432 12h-12.597l-.839-2h11.608l2.073-7.324-17.625-.676-.525-2h20.337z"/></svg>
            <span>سلة الطلب</span>
            <span class="cart-fab-badge" id="cartCount">0</span>
        </div>
        <span id="cartFabTotal">0.00 ر.س</span>
    </button>

    <!-- Product Details Modal -->
    <dialog id="productModal">
        <div class="modal-head">
            <h2 id="modalProdTitle">تفاصيل المنتج</h2>
            <button class="close" data-close="productModal">×</button>
        </div>
        <img id="modalProdImg" class="detail-img" src="" alt="">
        <p id="modalProdDesc" style="color:var(--muted);font-size:13px;line-height:1.5;margin-bottom:14px;"></p>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <span style="font-size:14px;color:var(--muted);font-weight:700;">السعر</span>
            <b id="modalProdPrice" style="color:var(--brown);font-size:20px;"></b>
        </div>
        <button class="primary" id="modalAddToCart">إضافة إلى السلة</button>
    </dialog>

    <!-- Checkout Modal -->
    <dialog id="cartModal">
        <div class="modal-head">
            <h2>إتمام الطلب</h2>
            <button class="close" data-close="cartModal">×</button>
        </div>

        <div id="cartItemsList" style="max-height:160px;overflow-y:auto;margin-bottom:12px;"></div>

        <div style="border-top:1px solid var(--beige);padding-top:10px;margin-bottom:14px;font-size:13px;">
            <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
                <span>مجموع الأصناف</span>
                <span id="subTotalText">0.00 ر.س</span>
            </div>
            <div style="display:flex;justify-content:space-between;margin-bottom:4px;color:var(--brown);" id="deliveryRow">
                <span>رسوم التوصيل</span>
                <span id="deliveryFeeText">0.00 ر.س</span>
            </div>
            <div style="display:flex;justify-content:space-between;font-weight:800;font-size:15px;margin-top:6px;border-top:1px dashed var(--beige);padding-top:6px;color:var(--dark);">
                <span>المجموع الكلي</span>
                <span id="grandTotalText">0.00 ر.س</span>
            </div>
        </div>

        <div class="input-group">
            <label>طريقة الاستلام</label>
            <div class="order-types" id="orderTypeSelector">
                <button type="button" class="order-type-btn active" data-type="car">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>
                    <span>استلام سيارة</span>
                </button>
                <button type="button" class="order-type-btn" data-type="delivery">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 7c0-1.1-.9-2-2-2h-3v2h3v2.65L13.52 14H10V9H4c-1.1 0-2 .9-2 2v6c0 1.1.9 2 2 2h1c0 1.66 1.34 3 3 3s3-1.34 3-3h4c0 1.66 1.34 3 3 3s3-1.34 3-3h1c1.1 0 2-.9 2-2v-5l-3-4zM8 19c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm11 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>
                    <span>توصيل</span>
                </button>
                <button type="button" class="order-type-btn" data-type="pickup">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M20 3H4v10c0 2.21 1.79 4 4 4h6c2.21 0 4-1.79 4-4v-3h2c1.11 0 2-.9 2-2V5c0-1.11-.89-2-2-2zm0 5h-2V5h2v3zM4 19h16v2H4z"/></svg>
                    <span>استلام فرع</span>
                </button>
            </div>
        </div>

        <form id="checkoutForm">
            <div class="saved-customer-badge" id="savedInfoNotice" style="display:none;">
                <span>تم استرجاع بياناتك المحفوظة</span>
                <span style="cursor:pointer;text-decoration:underline;" id="clearCustomerData">تعديل</span>
            </div>

            <div class="input-group">
                <label>الاسم</label>
                <input type="text" name="customer_name" id="custName" required placeholder="الاسم الكريم">
            </div>

            <div class="input-group">
                <label>رقم الجوال</label>
                <input type="tel" name="customer_phone" id="custPhone" required placeholder="05XXXXXXXX">
            </div>

            <div id="carPickupFields">
                <div class="input-group">
                    <label>نوع ولون السيارة</label>
                    <input type="text" name="car_model" id="carModel" placeholder="مثال: تاهو أسود">
                </div>
                <div class="input-group">
                    <label>رقم أو حروف اللوحة</label>
                    <input type="text" name="car_plate" id="carPlate" placeholder="مثال: أ ب ج 1234">
                </div>
            </div>

            <div id="deliveryFields" style="display:none;">
                <div class="input-group">
                    <label>عنوان التوصيل</label>
                    <input type="text" name="delivery_address" id="deliveryAddress" placeholder="الحي - الشارع - رقم المبنى">
                </div>
            </div>

            <div class="input-group">
                <label>ملاحظات إضافية</label>
                <input type="text" name="order_notes" placeholder="ملاحظات على الطلب...">
            </div>

            <button type="submit" class="primary" id="submitOrderBtn">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                <span>إرسال الطلب عبر واتساب</span>
            </button>
        </form>
    </dialog>

    <!-- Story Viewer Dialog with Tap Controls -->
    <dialog id="storyViewer">
        <button class="story-viewer-close" id="closeStory">×</button>
        <div class="story-progress-bar"><div class="story-progress-fill" id="storyProgress"></div></div>
        
        <div class="story-tap-area" id="storyTapLeft" title="السابق"></div>
        <div class="story-tap-area" id="storyTapRight" title="التالي"></div>

        <img id="storyViewerImg" class="story-viewer-img" src="" alt="">
        <div class="story-viewer-info">
            <h3 id="storyViewerTitle" style="margin:0 0 4px;font-size:15px;"></h3>
            <span id="storyViewerTag" style="color:var(--beige);font-size:12px;font-weight:bold;"></span>
        </div>
    </dialog>

    <div id="toast" class="toast"></div>

    <script>
        (() => {
            const cfg = window.VIBES_CONFIG
            const supabase = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey)
            const $ = s => document.querySelector(s)
            const $$ = s => document.querySelectorAll(s)

            let products = []
            let stories = []
            let cart = {}
            let settings = null
            let selectedProduct = null
            let orderType = 'car'
            let currentStoryIndex = 0
            let storyTimer = null

            const money = v => `${Number(v||0).toFixed(2)} ر.س`
            const esc = (v = '') => String(v).replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c]))

            function toast(msg) {
                const el = $('#toast')
                el.textContent = msg
                el.classList.add('show')
                setTimeout(() => el.classList.remove('show'), 2800)
            }

            async function init() {
                loadCustomerProfile()
                await Promise.all([loadSettings(), loadStories(), loadProducts()])
            }

            async function loadSettings() {
                const { data } = await supabase.from('store_settings').select('*').eq('id', 1).maybeSingle()
                if (data) {
                    settings = data
                    if (data.store_name) $('#storeNameHeader').textContent = data.store_name
                    if (data.logo_url) {
                        $('#brandLogoContainer').innerHTML = `<img src="${esc(data.logo_url)}" alt="Logo">`
                    }
                    const ig = data.instagram_username || cfg.defaultInstagram || 'vibes.espresso'
                    const tt = data.tiktok_username || cfg.defaultTiktok || 'vibes.espresso'
                    $('#instagramLink').href = `https://instagram.com/${ig}`
                    $('#tiktokLink').href = `https://tiktok.com/@${tt}`
                    if (data.google_maps_url) {
                        $('#mapsLink').href = data.google_maps_url
                        $('#mapsLink').style.display = 'inline-flex'
                    }
                }
            }

            async function loadStories() {
                const { data } = await supabase.from('stories').select('*').eq('active', true).order('created_at', { ascending: false })
                if (data && data.length) {
                    stories = data
                    renderStories()
                }
            }

            function renderStories() {
                const wrap = $('#storiesContainer')
                wrap.innerHTML = stories.map((s, idx) => `
                    <div class="story-circle-item" data-story-idx="${idx}">
                        <div class="story-ring">
                            <img class="story-img" src="${esc(s.image_url)}" alt="${esc(s.title)}">
                        </div>
                        <span class="story-title">${esc(s.title)}</span>
                    </div>
                `).join('')

                wrap.querySelectorAll('.story-circle-item').forEach(item => {
                    item.addEventListener('click', () => openStory(Number(item.dataset.storyIdx)))
                })
            }

            function openStory(idx) {
                if (idx < 0) idx = 0
                if (idx >= stories.length) {
                    clearInterval(storyTimer)
                    $('#storyViewer').close()
                    return
                }

                currentStoryIndex = idx
                const s = stories[idx]
                if (!s) return

                $('#storyViewerImg').src = s.image_url
                $('#storyViewerTitle').textContent = s.title
                $('#storyViewerTag').textContent = s.tag || 'جديد'
                
                if (!$('#storyViewer').open) {
                    $('#storyViewer').showModal()
                }

                const fill = $('#storyProgress')
                fill.style.width = '0%'
                let progress = 0
                clearInterval(storyTimer)

                storyTimer = setInterval(() => {
                    progress += 2
                    fill.style.width = `${progress}%`
                    if (progress >= 100) {
                        clearInterval(storyTimer)
                        nextStory()
                    }
                }, 100)
            }

            function nextStory() {
                clearInterval(storyTimer)
                if (currentStoryIndex + 1 < stories.length) {
                    openStory(currentStoryIndex + 1)
                } else {
                    $('#storyViewer').close()
                }
            }

            function prevStory() {
                clearInterval(storyTimer)
                if (currentStoryIndex > 0) {
                    openStory(currentStoryIndex - 1)
                } else {
                    openStory(0)
                }
            }

            $('#storyTapRight').addEventListener('click', e => {
                e.stopPropagation()
                nextStory()
            })

            $('#storyTapLeft').addEventListener('click', e => {
                e.stopPropagation()
                prevStory()
            })

            $('#closeStory').addEventListener('click', () => {
                clearInterval(storyTimer)
                $('#storyViewer').close()
            })

            async function loadProducts(cat = 'all') {
                let query = supabase.from('products').select('*').eq('active', true).order('sort_order').order('created_at')
                if (cat !== 'all') query = query.eq('category', cat)
                const { data, error } = await query
                if (error) return toast(error.message)
                products = data || []
                renderProducts()
            }

            function renderProducts() {
                const container = $('#productList')
                if (!products.length) {
                    container.innerHTML = '<p style="text-align:center;grid-column:1/-1;color:var(--muted);padding:30px;">لا توجد أصناف مطابقة</p>'
                    return
                }
                container.innerHTML = products.map(p => `
                    <div class="product" data-prod-id="${p.id}">
                        ${p.popular ? '<span class="badge">الأكثر طلباً</span>' : ''}
                        ${p.image_url ? `<img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy">` : '<div class="image-placeholder"><svg class="svg-icon" style="width:36px;height:36px;fill:var(--brown);" viewBox="0 0 24 24"><path d="M20 3H4v10c0 2.21 1.79 4 4 4h6c2.21 0 4-1.79 4-4v-3h2c1.11 0 2-.9 2-2V5c0-1.11-.89-2-2-2zm0 5h-2V5h2v3zM4 19h16v2H4z"/></svg></div>'}
                        <div class="product-content">
                            <h3>${esc(p.name)}</h3>
                            <p>${esc(p.description || '')}</p>
                            <div class="product-bottom">
                                <span class="price">${money(p.price)}</span>
                            </div>
                        </div>
                        <button class="add" data-add-id="${p.id}">+</button>
                    </div>
                `).join('')

                container.querySelectorAll('.product').forEach(card => {
                    card.addEventListener('click', e => {
                        if (e.target.closest('.add')) return
                        const p = products.find(x => x.id === card.dataset.prodId)
                        if (p) openProductModal(p)
                    })
                })

                container.querySelectorAll('.add').forEach(btn => {
                    btn.addEventListener('click', e => {
                        e.stopPropagation()
                        const p = products.find(x => x.id === btn.dataset.addId)
                        if (p) addToCart(p)
                    })
                })
            }

            function openProductModal(p) {
                selectedProduct = p
                $('#modalProdTitle').textContent = p.name
                $('#modalProdDesc').textContent = p.description || ''
                $('#modalProdPrice').textContent = money(p.price)
                if (p.image_url) {
                    $('#modalProdImg').src = p.image_url
                    $('#modalProdImg').style.display = 'block'
                } else {
                    $('#modalProdImg').style.display = 'none'
                }
                $('#productModal').showModal()
            }

            $('#modalAddToCart').addEventListener('click', () => {
                if (selectedProduct) {
                    addToCart(selectedProduct)
                    $('#productModal').close()
                }
            })

            function addToCart(p) {
                cart[p.id] = (cart[p.id] || 0) + 1
                updateCartUI()
                toast(`تمت إضافة ${p.name}`)
            }

            function updateCartUI() {
                const count = Object.values(cart).reduce((a, b) => a + b, 0)
                const subtotal = Object.entries(cart).reduce((sum, [id, qty]) => {
                    const p = products.find(x => x.id === id)
                    return sum + (p ? p.price * qty : 0)
                }, 0)

                $('#cartCount').textContent = count
                $('#cartFabTotal').textContent = money(subtotal)
                $('#cartFab').classList.toggle('hidden', count === 0)

                $('#subTotalText').textContent = money(subtotal)
                const deliveryFee = orderType === 'delivery' ? (Number(settings?.delivery_fee) || 15) : 0
                $('#deliveryFeeText').textContent = money(deliveryFee)
                $('#grandTotalText').textContent = money(subtotal + deliveryFee)

                renderCartItems()
            }

            function renderCartItems() {
                const wrap = $('#cartItemsList')
                if (!Object.keys(cart).length) {
                    wrap.innerHTML = '<p style="color:var(--muted);text-align:center;padding:10px;">السلة فارغة</p>'
                    return
                }
                wrap.innerHTML = Object.entries(cart).map(([id, qty]) => {
                    const p = products.find(x => x.id === id)
                    if (!p) return ''
                    return `
                        <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #eee;">
                            <div>
                                <b style="font-size:13px;">${esc(p.name)}</b>
                                <div style="color:var(--brown);font-size:12px;font-weight:700;">${money(p.price * qty)}</div>
                            </div>
                            <div style="display:flex;align-items:center;gap:8px;">
                                <button type="button" class="secondary" style="padding:2px 8px;border-radius:6px;" data-cart-action="minus" data-id="${id}">-</button>
                                <span style="font-weight:700;">${qty}</span>
                                <button type="button" class="primary" style="padding:2px 8px;border-radius:6px;width:auto;" data-cart-action="plus" data-id="${id}">+</button>
                            </div>
                        </div>
                    `
                }).join('')

                wrap.querySelectorAll('[data-cart-action]').forEach(b => {
                    b.addEventListener('click', () => {
                        const id = b.dataset.id
                        if (b.dataset.cartAction === 'plus') cart[id]++
                        else {
                            cart[id]--
                            if (cart[id] <= 0) delete cart[id]
                        }
                        updateCartUI()
                    })
                })
            }

            function saveCustomerProfile(data) {
                localStorage.setItem('vibes_customer', JSON.stringify(data))
            }

            function loadCustomerProfile() {
                const raw = localStorage.getItem('vibes_customer')
                if (!raw) return
                try {
                    const data = JSON.parse(raw)
                    if (data.name) $('#custName').value = data.name
                    if (data.phone) $('#custPhone').value = data.phone
                    if (data.carModel) $('#carModel').value = data.carModel
                    if (data.carPlate) $('#carPlate').value = data.carPlate
                    if (data.address) $('#deliveryAddress').value = data.address
                    $('#savedInfoNotice').style.display = 'flex'
                } catch(e){}
            }

            $('#clearCustomerData').addEventListener('click', () => {
                localStorage.removeItem('vibes_customer')
                $('#custName').value = ''
                $('#custPhone').value = ''
                $('#carModel').value = ''
                $('#carPlate').value = ''
                $('#deliveryAddress').value = ''
                $('#savedInfoNotice').style.display = 'none'
            })

            $('#orderTypeSelector').addEventListener('click', e => {
                const btn = e.target.closest('.order-type-btn')
                if (!btn) return
                $$('.order-type-btn').forEach(b => b.classList.remove('active'))
                btn.classList.add('active')
                orderType = btn.dataset.type

                $('#carPickupFields').style.display = orderType === 'car' ? 'block' : 'none'
                $('#deliveryFields').style.display = orderType === 'delivery' ? 'block' : 'none'
                $('#deliveryRow').style.display = orderType === 'delivery' ? 'flex' : 'none'
                updateCartUI()
            })

            $('#checkoutForm').addEventListener('submit', async e => {
                e.preventDefault()
                const fd = new FormData(e.currentTarget)
                const name = fd.get('customer_name').trim()
                const phone = fd.get('customer_phone').trim()
                const carModel = fd.get('car_model') || ''
                const carPlate = fd.get('car_plate') || ''
                const address = fd.get('delivery_address') || ''
                const notes = fd.get('order_notes') || ''

                saveCustomerProfile({ name, phone, carModel, carPlate, address })

                const items = Object.entries(cart).map(([id, qty]) => {
                    const p = products.find(x => x.id === id)
                    return { id, name: p.name, price: p.price, qty }
                })
                if (!items.length) return toast('السلة فارغة')

                const subtotal = items.reduce((s, i) => s + (i.price * i.qty), 0)
                const deliveryFee = orderType === 'delivery' ? (Number(settings?.delivery_fee) || 15) : 0
                const grandTotal = subtotal + deliveryFee

                let typeText = 'استلام من السيارة'
                let detailsText = `السيارة: ${carModel}\nاللوحة: ${carPlate}`
                if (orderType === 'delivery') {
                    typeText = 'توصيل'
                    detailsText = `العنوان: ${address}\nرسوم التوصيل: ${money(deliveryFee)}`
                } else if (orderType === 'pickup') {
                    typeText = 'استلام من الفرع'
                    detailsText = 'استلام محلي'
                }

                let msg = `*طلب جديد من Vibes*\n`
                msg += `-----------------------------\n`
                msg += `*العميل:* ${name}\n`
                msg += `*الجوال:* ${phone}\n`
                msg += `*طريقة الاستلام:* ${typeText}\n`
                msg += `${detailsText}\n`
                msg += `-----------------------------\n`
                msg += `*الأصناف:*\n`
                items.forEach(i => {
                    msg += `• ${i.name} × ${i.qty} = ${money(i.price * i.qty)}\n`
                })
                msg += `-----------------------------\n`
                if (orderType === 'delivery') {
                    msg += `*المجموع الفرعي:* ${money(subtotal)}\n`
                    msg += `*التوصيل:* ${money(deliveryFee)}\n`
                }
                msg += `*المجموع الإجمالي:* ${money(grandTotal)}\n`
                if (notes) msg += `*ملاحظات:* ${notes}\n`
                msg += `-----------------------------`

                const whatsappNumber = (settings?.whatsapp_number || '966500000000').replace(/\D/g, '')
                const whatsappUrl = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(msg)}`
                
                toast('تم تجهيز طلبك، جاري التحويل للواتساب...')
                setTimeout(() => {
                    window.open(whatsappUrl, '_blank')
                    cart = {}
                    updateCartUI()
                    $('#cartModal').close()
                }, 1000)
            })

            $('#cartFab').addEventListener('click', () => $('#cartModal').showModal())
            $('#filterChips').addEventListener('click', e => {
                const b = e.target.closest('[data-category]')
                if (!b) return
                $$('#filterChips button').forEach(x => x.classList.remove('active'))
                b.classList.add('active')
                loadProducts(b.dataset.category)
            })
            document.addEventListener('click', e => {
                const close = e.target.closest('[data-close]')
                if (close) document.getElementById(close.dataset.close).close()
            })

            init()
        })()
    </script>
</body>
</html>
