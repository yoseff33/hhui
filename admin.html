<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Vibes | لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js" defer></script>
    <script src="config.js" defer></script>
    <script src="admin.js" defer></script>
</head>
<body class="admin-body">
    <main class="admin-container">

        <!-- LOGIN -->
        <section id="loginView" class="login-card">
            <div class="logo">V</div>
            <h1>دخول الإدارة</h1>
            <p class="muted">لوحة تحكم كافيه Vibes</p>
            <form id="loginForm">
                <label>البريد الإلكتروني
                    <input name="email" type="email" required autocomplete="username">
                </label>
                <label>كلمة المرور
                    <input name="password" type="password" required autocomplete="current-password">
                </label>
                <button class="primary" type="submit">دخول</button>
            </form>
            <p id="loginError" class="error"></p>
            <a href="index.html">العودة للمتجر</a>
        </section>

        <!-- DASHBOARD -->
        <section id="dashboardView" class="hidden">
            <header class="dashboard-head">
                <div>
                    <h1>لوحة تحكم Vibes</h1>
                    <p id="adminEmail" class="muted"></p>
                    <p id="adminRole" class="muted" style="font-size:13px"></p>
                </div>
                <div class="actions">
                    <a class="secondary" href="index.html">عرض المتجر</a>
                    <button id="logout" class="danger">خروج</button>
                </div>
            </header>

            <div class="stats">
                <article><span>المنتجات</span><b id="productStat">0</b></article>
                <article><span>القصص المنشورة</span><b id="storyStat">0</b></article>
                <article><span>طلبات اليوم</span><b id="orderStat">0</b></article>
                <article><span>مبيعات اليوم</span><b id="salesStat">0 ر.س</b></article>
            </div>

            <div class="admin-tabs">
                <button class="active" data-tab="ordersPane">الطلبات</button>
                <button data-tab="productsPane">المنتجات</button>
                <button data-tab="storiesPane">القصص والستوري</button>
                <button data-tab="settingsPane">الإعدادات والشعار</button>
                <button data-tab="usersPane" id="usersTab">المستخدمين</button>
            </div>

            <!-- ORDERS -->
            <section id="ordersPane" class="pane">
                <div class="section-head">
                    <h2>الطلبات</h2>
                    <button id="refreshOrders" class="secondary">تحديث</button>
                </div>
                <div id="ordersTable" class="table-wrap"></div>
            </section>

            <!-- PRODUCTS -->
            <section id="productsPane" class="pane hidden">
                <div class="section-head">
                    <h2>المنتجات والمشروبات</h2>
                    <button id="newProduct" class="primary small">+ منتج جديد</button>
                </div>
                <div id="productsTable" class="table-wrap"></div>
            </section>

            <!-- STORIES -->
            <section id="storiesPane" class="pane hidden">
                <div class="section-head">
                    <h2>القصص والستوري (الهبات والترند)</h2>
                    <button id="newStory" class="primary small">+ قصة جديدة</button>
                </div>
                <div id="storiesTable" class="table-wrap"></div>
            </section>

            <!-- SETTINGS -->
            <section id="settingsPane" class="pane hidden">
                <h2>إعدادات المتجر والشعار</h2>
                <form id="settingsForm" class="card-form">
                    <label>شعار الكافيه (Logo)
                        <div class="file-input-wrapper">
                            <span>تغيير صورة الشعار</span>
                            <input type="file" id="logoImageFile" accept="image/*">
                        </div>
                        <img id="logoPreview" class="image-preview" style="display:none;width:80px;height:80px;object-fit:cover;border-radius:12px;margin-top:8px;">
                        <input type="hidden" name="logo_url" id="logoUrlInput">
                    </label>
                    <label>اسم المتجر
                        <input name="store_name" required maxlength="80">
                    </label>
                    <label>رقم واتساب الطلبات (بدون +)
                        <input name="whatsapp_number" required pattern="[0-9]{8,15}">
                    </label>
                    <label>يوزر انستقرام (Instagram)
                        <input name="instagram_username" placeholder="vibes.espresso">
                    </label>
                    <label>يوزر تيك توك (TikTok)
                        <input name="tiktok_username" placeholder="vibes.espresso">
                    </label>
                    <label>رابط الموقع في قوقل ماب (Google Maps)
                        <input name="google_maps_url" type="url" placeholder="https://maps.app.goo.gl/...">
                    </label>
                    <label>رسوم التوصيل (ر.س)
                        <input name="delivery_fee" type="number" step="0.01" min="0" value="15.00">
                    </label>
                    <label>يفتح الساعة
                        <input name="open_hour" type="number" min="0" max="23" required>
                    </label>
                    <label>يغلق الساعة
                        <input name="close_hour" type="number" min="0" max="23" required>
                    </label>
                    <label class="check">
                        <input name="is_open" type="checkbox"> استقبال الطلبات مفعل
                    </label>
                    <button class="primary" type="submit">حفظ الإعدادات</button>
                </form>
            </section>

            <!-- USERS -->
            <section id="usersPane" class="pane hidden">
                <div class="section-head">
                    <h2>إدارة المستخدمين</h2>
                    <button id="refreshUsers" class="secondary">تحديث</button>
                </div>
                <div id="usersTable" class="table-wrap"></div>
            </section>
        </section>
    </main>

    <!-- PRODUCT MODAL -->
    <dialog id="productEditor" class="modal">
        <button class="close" data-close="productEditor">×</button>
        <h2 id="editorTitle">منتج جديد</h2>
        <form id="productForm" class="card-form">
            <input name="id" type="hidden">
            <label>اسم المنتج
                <input name="name" required maxlength="100">
            </label>
            <label>الوصف
                <textarea name="description" maxlength="300"></textarea>
            </label>
            <label>السعر
                <input name="price" type="number" min="0" step="0.01" required>
            </label>
            <label>التصنيف
                <select name="category" required>
                    <option value="coffee">القهوة</option>
                    <option value="cold">مشروبات باردة</option>
                    <option value="sweets">الحلويات</option>
                    <option value="other">أخرى</option>
                </select>
            </label>
            <label>صورة المنتج
                <div class="file-input-wrapper">
                    <span>اختر صورة</span>
                    <input type="file" id="productImage" accept="image/*">
                </div>
                <img id="imagePreview" class="image-preview" style="display:none;width:80px;height:80px;object-fit:cover;border-radius:10px;margin-top:8px;">
                <input type="hidden" name="image_url" id="imageUrlInput">
            </label>
            <label class="check">
                <input name="popular" type="checkbox"> الأكثر طلباً
            </label>
            <label class="check">
                <input name="active" type="checkbox" checked> ظاهر في المتجر
            </label>
            <button class="primary" type="submit">حفظ المنتج</button>
        </form>
    </dialog>

    <!-- STORY MODAL -->
    <dialog id="storyEditor" class="modal">
        <button class="close" data-close="storyEditor">×</button>
        <h2>إضافة قصة جديدة</h2>
        <form id="storyForm" class="card-form">
            <label>عنوان الستوري (مثل: هبة الصيف / جديدنا)
                <input name="title" required maxlength="40">
            </label>
            <label>الوسم
                <input name="tag" placeholder="جديد Vibes" maxlength="25">
            </label>
            <label>صورة القصة
                <div class="file-input-wrapper">
                    <span>اختر صورة الستوري</span>
                    <input type="file" id="storyImageFile" accept="image/*" required>
                </div>
                <img id="storyPreview" class="image-preview" style="display:none;width:80px;height:120px;object-fit:cover;border-radius:10px;margin-top:8px;">
            </label>
            <button class="primary" type="submit">نشر الستوري</button>
        </form>
    </dialog>

    <div id="toast" class="toast"></div>
</body>
</html>
