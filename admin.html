<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم Vibes</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23795239'><path d='M2 21h18v-2H2v2zM20 8h-2V5h2m-4 0H4v6c0 2.21 1.79 4 4 4h6c2.21 0 4-1.79 4-4V5z'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Tajawal', sans-serif;
      background: #f5f0eb;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .admin-container {
      max-width: 900px;
      width: 100%;
      background: #fff;
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.12);
    }
    .login-box {
      text-align: center;
      padding: 30px 0;
    }
    .login-box h2 { color: #795239; margin-bottom: 10px; }
    .login-box p { color: #7A6A5D; margin-bottom: 20px; }
    .login-box input {
      width: 80%;
      padding: 12px 20px;
      border: 1px solid #ddd;
      border-radius: 999px;
      font-size: 1rem;
      margin-bottom: 15px;
      outline: none;
      font-family: 'Tajawal', sans-serif;
    }
    .login-box input:focus {
      border-color: #795239;
      box-shadow: 0 0 0 3px rgba(121,82,57,0.08);
    }
    .login-box button {
      padding: 12px 40px;
      border: none;
      border-radius: 999px;
      background: #795239;
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background .2s;
      font-family: 'Tajawal', sans-serif;
    }
    .login-box button:hover { background: #5A3A2A; }
    .login-box button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error-msg {
      color: #C62828;
      margin-top: 10px;
      display: none;
      font-weight: 700;
    }
    .admin-panel { display: none; }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .admin-header h1 { color: #795239; font-size: 1.5rem; }
    .admin-header button {
      border: none;
      background: #eee;
      padding: 8px 20px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Tajawal', sans-serif;
      transition: background .2s;
    }
    .admin-header button:hover { background: #ddd; }

    .admin-form {
      background: #faf7f4;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 25px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .admin-form .full { grid-column: 1/3; }
    .admin-form label {
      font-weight: 700;
      font-size: .8rem;
      color: #7A6A5D;
      display: block;
      margin-bottom: 4px;
    }
    .admin-form input, .admin-form select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 999px;
      font-family: 'Tajawal', sans-serif;
      outline: none;
      font-size: .95rem;
    }
    .admin-form input:focus, .admin-form select:focus {
      border-color: #795239;
      box-shadow: 0 0 0 3px rgba(121,82,57,0.08);
    }
    .admin-form .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-top: 6px;
    }
    .admin-form .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: .9rem;
      cursor: pointer;
    }
    .admin-form .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #795239;
      cursor: pointer;
    }
    .admin-form .actions {
      grid-column: 1/3;
      display: flex;
      gap: 10px;
    }
    .admin-form .actions button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Tajawal', sans-serif;
      font-size: 1rem;
      transition: background .2s;
    }
    .btn-save { background: #795239; color: #fff; }
    .btn-save:hover { background: #5A3A2A; }
    .btn-cancel { background: #eee; color: #555; display: none; }
    .btn-cancel:hover { background: #ddd; }

    .product-list {
      max-height: 400px;
      overflow-y: auto;
    }
    .product-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }
    .product-item img {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 10px;
      background: #eee;
    }
    .product-item .info { flex: 1; min-width: 0; }
    .product-item .info .name { font-weight: 800; font-size: .95rem; }
    .product-item .info .meta { font-size: .8rem; color: #7A6A5D; }
    .product-item .actions { display: flex; gap: 4px; flex: 0 0 auto; }
    .product-item .actions button {
      border: none;
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
      font-size: .75rem;
      font-family: 'Tajawal', sans-serif;
      transition: background .2s;
    }
    .btn-edit { background: #795239; color: #fff; }
    .btn-edit:hover { background: #5A3A2A; }
    .btn-delete { background: #C62828; color: #fff; }
    .btn-delete:hover { background: #B71C1C; }
    .empty { text-align: center; color: #999; padding: 30px 0; }

    #currentImage {
      font-size: .8rem;
      color: #7A6A5D;
      margin-top: 4px;
      word-break: break-all;
    }
    @media (max-width: 600px) {
      .admin-container { padding: 16px; }
      .admin-form { grid-template-columns: 1fr; }
      .admin-form .full, .admin-form .actions { grid-column: 1/2; }
    }
  </style>
</head>
<body>
<div class="admin-container">

  <!-- ===== LOGIN ===== -->
  <div id="loginBox" class="login-box">
    <h2>🔐 لوحة التحكم</h2>
    <p>سجل دخولك بحساب المشرف</p>
    <input type="email" id="adminEmail" placeholder="البريد الإلكتروني" />
    <input type="password" id="adminPassword" placeholder="كلمة المرور" />
    <button id="loginBtn">دخول</button>
    <div id="loginError" class="error-msg"></div>
  </div>

  <!-- ===== ADMIN PANEL ===== -->
  <div id="adminPanel" class="admin-panel">

    <div class="admin-header">
      <h1>⚙️ إدارة المنتجات</h1>
      <button id="logoutBtn">تسجيل خروج</button>
    </div>

    <!-- Form -->
    <form id="productForm" class="admin-form">
      <input type="hidden" id="editId" />

      <div>
        <label for="productName">الاسم *</label>
        <input type="text" id="productName" required placeholder="مثلاً: كابتشينو" />
      </div>
      <div>
        <label for="productPrice">السعر (ر.س) *</label>
        <input type="number" id="productPrice" required step="0.5" placeholder="مثلاً: 15" />
      </div>

      <div>
        <label for="productCategory">التصنيف *</label>
        <select id="productCategory">
          <option value="coffee">قهوة</option>
          <option value="cold">مشروبات باردة</option>
          <option value="sweets">حلويات</option>
        </select>
      </div>
      <div class="checkbox-group">
        <label>
          <input type="checkbox" id="productPopular" /> الأكثر طلبًا
        </label>
      </div>

      <div class="full">
        <label for="productDesc">الوصف</label>
        <input type="text" id="productDesc" placeholder="وصف مختصر للمنتج" />
      </div>

      <div class="full">
        <label for="productImage">الصورة</label>
        <input type="file" id="productImage" accept="image/*" />
        <div id="currentImage"></div>
      </div>

      <div class="actions">
        <button type="submit" class="btn-save" id="submitBtn">حفظ</button>
        <button type="button" class="btn-cancel" id="cancelBtn">إلغاء</button>
      </div>
    </form>

    <!-- Products list -->
    <h3 style="margin-bottom:10px;">📦 قائمة المنتجات</h3>
    <div id="productsList" class="product-list"></div>
  </div>
</div>

<script>
  // ============================================================
  //  CONFIGURATION (تم تحديث المفتاح)
  // ============================================================
  const CONFIG = {
    supabaseUrl: 'https://lqdgqyhagpzzeelwfcyn.supabase.co',
    supabaseAnonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxxZGdxeWhhZ3B6emVlbHdmY3luIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNjk2ODYsImV4cCI6MjEwMjY0NTY4Nn0.905RefxSGM9kzkmEESwaRjBswK9z5td84TdM7lBmNPs',
  };

  // ============================================================
  //  SUPABASE CLIENT
  // ============================================================
  const supabase = window.supabase.createClient(
    CONFIG.supabaseUrl,
    CONFIG.supabaseAnonKey
  );

  // ============================================================
  //  DOM REFS
  // ============================================================
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => document.querySelectorAll(s);

  const loginBox = $('#loginBox');
  const adminPanel = $('#adminPanel');
  const emailInput = $('#adminEmail');
  const passwordInput = $('#adminPassword');
  const loginBtn = $('#loginBtn');
  const loginError = $('#loginError');
  const logoutBtn = $('#logoutBtn');

  const form = $('#productForm');
  const editId = $('#editId');
  const productName = $('#productName');
  const productPrice = $('#productPrice');
  const productCategory = $('#productCategory');
  const productPopular = $('#productPopular');
  const productDesc = $('#productDesc');
  const productImage = $('#productImage');
  const currentImage = $('#currentImage');
  const submitBtn = $('#submitBtn');
  const cancelBtn = $('#cancelBtn');
  const productsList = $('#productsList');

  let products = [];
  let editingId = null;
  let currentUser = null;

  // ============================================================
  //  AUTH – LOGIN
  // ============================================================
  async function login() {
    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();

    if (!email || !password) {
      loginError.textContent = '⚠️ الرجاء إدخال البريد وكلمة المرور';
      loginError.style.display = 'block';
      return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = 'جاري الدخول...';
    loginError.style.display = 'none';

    try {
      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password,
      });

      if (error) throw error;

      // تحقق من دور المستخدم
      const { data: profile, error: profileError } = await supabase
        .from('profiles')
        .select('role')
        .eq('id', data.user.id)
        .single();

      if (profileError || !profile) {
        throw new Error('لا يوجد ملف شخصي لهذا المستخدم');
      }

      if (profile.role !== 'admin') {
        await supabase.auth.signOut();
        throw new Error('هذا الحساب ليس لديه صلاحيات المشرف');
      }

      currentUser = data.user;
      loginBox.style.display = 'none';
      adminPanel.style.display = 'block';
      loginError.style.display = 'none';
      fetchProducts();

    } catch (err) {
      loginError.textContent = '❌ ' + err.message;
      loginError.style.display = 'block';
      console.error(err);
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = 'دخول';
    }
  }

  // ============================================================
  //  AUTH – LOGOUT
  // ============================================================
  async function logout() {
    await supabase.auth.signOut();
    currentUser = null;
    loginBox.style.display = 'block';
    adminPanel.style.display = 'none';
    products = [];
    productsList.innerHTML = '';
    emailInput.value = '';
    passwordInput.value = '';
    loginError.style.display = 'none';
  }

  loginBtn.addEventListener('click', login);
  passwordInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') login();
  });
  emailInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') login();
  });
  logoutBtn.addEventListener('click', logout);

  // ============================================================
  //  FETCH PRODUCTS
  // ============================================================
  async function fetchProducts() {
    try {
      const { data, error } = await supabase
        .from('products')
        .select('*')
        .order('created_at', { ascending: false });
      if (error) throw error;
      products = data || [];
      renderProducts();
    } catch (err) {
      console.error(err);
      alert('⚠️ فشل تحميل المنتجات');
    }
  }

  // ============================================================
  //  RENDER PRODUCTS LIST
  // ============================================================
  function renderProducts() {
    if (!products.length) {
      productsList.innerHTML = '<div class="empty">لا توجد منتجات</div>';
      return;
    }
    let html = '';
    products.forEach(p => {
      const img = p.image_url ?
        `<img src="${p.image_url}" alt="${p.name}" />` :
        `<div style="width:50px;height:50px;background:#eee;border-radius:10px;display:grid;place-items:center;color:#aaa;font-size:1.5rem;">🖼️</div>`;
      html += `
        <div class="product-item">
          ${img}
          <div class="info">
            <div class="name">${escapeHtml(p.name)}</div>
            <div class="meta">${p.price} ر.س • ${p.category} ${p.popular ? '⭐' : ''}</div>
          </div>
          <div class="actions">
            <button class="btn-edit" data-id="${p.id}">✎</button>
            <button class="btn-delete" data-id="${p.id}">✕</button>
          </div>
        </div>
      `;
    });
    productsList.innerHTML = html;

    // Bind events
    productsList.querySelectorAll('.btn-edit').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        const p = products.find(x => x.id === id);
        if (p) loadForEdit(p);
      });
    });
    productsList.querySelectorAll('.btn-delete').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        const p = products.find(x => x.id === id);
        if (!p) return;
        if (!confirm(`حذف "${p.name}"؟`)) return;
        await deleteProduct(id);
      });
    });
  }

  // ============================================================
  //  UTILITY
  // ============================================================
  function escapeHtml(str) {
    if (!str) return '';
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
    return str.replace(/[&<>"']/g, (m) => map[m]);
  }

  function resetForm() {
    editId.value = '';
    productName.value = '';
    productPrice.value = '';
    productCategory.value = 'coffee';
    productPopular.checked = false;
    productDesc.value = '';
    productImage.value = '';
    currentImage.textContent = '';
    submitBtn.textContent = 'حفظ';
    cancelBtn.style.display = 'none';
    editingId = null;
  }

  function loadForEdit(product) {
    editingId = product.id;
    editId.value = product.id;
    productName.value = product.name;
    productPrice.value = product.price;
    productCategory.value = product.category;
    productPopular.checked = !!product.popular;
    productDesc.value = product.description || '';
    currentImage.textContent = product.image_url ? `الصورة الحالية: ${product.image_url}` : 'لا توجد صورة';
    submitBtn.textContent = 'تحديث';
    cancelBtn.style.display = 'inline-block';
    productImage.value = '';
  }

  // ============================================================
  //  UPLOAD IMAGE
  // ============================================================
  async function uploadImage(file) {
    const ext = file.name.split('.').pop();
    const fileName = `${Date.now()}.${ext}`;
    const path = `products/${fileName}`;
    const { error } = await supabase.storage
      .from('product-images')
      .upload(path, file, { cacheControl: '3600', upsert: false });
    if (error) throw error;
    const { data } = supabase.storage.from('product-images').getPublicUrl(path);
    return data.publicUrl;
  }

  // ============================================================
  //  SAVE PRODUCT
  // ============================================================
  async function saveProduct(e) {
    e.preventDefault();

    const name = productName.value.trim();
    const price = parseFloat(productPrice.value);
    const category = productCategory.value;
    const popular = productPopular.checked;
    const description = productDesc.value.trim();
    const file = productImage.files[0];

    if (!name || isNaN(price) || price <= 0) {
      alert('⚠️ الرجاء تعبئة الاسم والسعر بشكل صحيح');
      return;
    }

    try {
      let imageUrl = null;
      if (editingId) {
        const existing = products.find(p => p.id === editingId);
        if (existing && existing.image_url) imageUrl = existing.image_url;
      }
      if (file) {
        imageUrl = await uploadImage(file);
      }

      const payload = {
        name,
        price,
        category,
        popular,
        description: description || null,
        image_url: imageUrl,
        options: {
          temperature: category === 'coffee' || category === 'cold',
          milk: category === 'cold',
          extraShot: category === 'coffee' || category === 'cold',
        },
        updated_at: new Date().toISOString(),
      };

      let result;
      if (editingId) {
        const { data, error } = await supabase
          .from('products')
          .update(payload)
          .eq('id', editingId)
          .select();
        if (error) throw error;
        result = data;
        alert('✅ تم تحديث المنتج');
      } else {
        payload.created_at = new Date().toISOString();
        const { data, error } = await supabase
          .from('products')
          .insert(payload)
          .select();
        if (error) throw error;
        result = data;
        alert('✅ تمت إضافة المنتج');
      }

      resetForm();
      await fetchProducts();
    } catch (err) {
      console.error(err);
      alert('⚠️ فشل الحفظ: ' + err.message);
    }
  }

  // ============================================================
  //  DELETE PRODUCT
  // ============================================================
  async function deleteProduct(id) {
    try {
      const product = products.find(p => p.id === id);
      if (product && product.image_url) {
        try {
          const url = new URL(product.image_url);
          const pathParts = url.pathname.split('/');
          const bucketIndex = pathParts.indexOf('product-images');
          if (bucketIndex !== -1) {
            const path = pathParts.slice(bucketIndex + 1).join('/');
            if (path) {
              await supabase.storage.from('product-images').remove([path]);
            }
          }
        } catch (_) {}
      }

      const { error } = await supabase.from('products').delete().eq('id', id);
      if (error) throw error;

      alert('🗑️ تم حذف المنتج');
      await fetchProducts();
    } catch (err) {
      console.error(err);
      alert('⚠️ فشل الحذف: ' + err.message);
    }
  }

  // ============================================================
  //  FORM EVENTS
  // ============================================================
  form.addEventListener('submit', saveProduct);
  cancelBtn.addEventListener('click', resetForm);

  // ============================================================
  //  CHECK SESSION ON LOAD
  // ============================================================
  async function checkSession() {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      const { data: profile } = await supabase
        .from('profiles')
        .select('role')
        .eq('id', session.user.id)
        .single();
      if (profile && profile.role === 'admin') {
        currentUser = session.user;
        loginBox.style.display = 'none';
        adminPanel.style.display = 'block';
        fetchProducts();
      }
    }
  }
  checkSession();
</script>
</body>
</html>
