<!DOCTYPE html>
<html dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Vibes</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
</head>
<body>
  <div class="container">
    <div class="products" id="productList"></div>
  </div>
  <script>
    (async () => {
      const supabase = window.supabase.createClient(VIBES_CONFIG.supabaseUrl, VIBES_CONFIG.supabaseAnonKey);
      const { data: products } = await supabase.from('products').select('*').eq('active', true).order('sort_order');
      document.getElementById('productList').innerHTML = products.map(p => `
        <div class="product">
          <img src="${p.image_url || ''}" alt="${p.name}" style="width:100%;aspect-ratio:1;object-fit:cover;background:#eadfd4;">
          <div class="product-content">
            <h3>${p.name}</h3>
            <p>${p.description || ''}</p>
            <span class="price">${Number(p.price).toFixed(2)} ر.س</span>
          </div>
        </div>
      `).join('');
    })();
  </script>
</body>
</html>
