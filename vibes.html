  <style>
:root{--brown:#795239;--dark:#2d1f16;--cream:#f6f2ed;--beige:#eadfd4;--white:#fff;--green:#267447;--red:#b42318;--muted:#74675f;--shadow:0 12px 35px #3b251315}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--dark);font-family:Tajawal,sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button,a{cursor:pointer}.hero{text-align:center;background:#fff;padding:28px 16px 22px;position:relative;border-bottom:1px solid #0000000b}.logo{width:52px;height:52px;margin:auto;display:grid;place-items:center;border-radius:50%;background:var(--brown);color:#fff;font-size:28px;font-weight:900}.hero h1{letter-spacing:5px;color:var(--brown);margin:8px 0 0}.hero p{margin:0 0 8px}.admin-link{position:absolute;left:18px;top:18px;color:var(--brown);text-decoration:none;font-size:14px}.status{display:inline-block;padding:4px 12px;border-radius:20px;background:#e5f5e9;color:var(--green);font-size:13px;font-weight:700}.status.closed{background:#fee4e2;color:var(--red)}.container{max-width:1050px;margin:auto;padding:18px}.search{background:#fff;border:1px solid #dbcabd;border-radius:30px;display:flex;align-items:center;padding:0 15px}.search input{width:100%;border:0;outline:0;background:transparent;padding:12px}.chips{display:flex;gap:8px;overflow:auto;padding:14px 0}.chips button,.admin-tabs button{border:0;border-radius:20px;padding:8px 16px;background:var(--beige);white-space:nowrap}.chips button.active,.admin-tabs button.active{background:var(--brown);color:#fff}.products{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.product{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 3px 13px #0000000c;position:relative}.product img,.image-placeholder{width:100%;aspect-ratio:1;object-fit:cover;background:var(--beige);display:grid;place-items:center;color:var(--brown);font-size:45px}.product-content{padding:12px}.product h3{font-size:16px;margin:0}.product p{font-size:13px;color:var(--muted);margin:4px 0;min-height:38px}.price{color:var(--brown);font-weight:900}.add{position:absolute;left:10px;bottom:10px;border:0;border-radius:50%;width:34px;height:34px;background:var(--brown);color:#fff;font-size:21px}.badge{position:absolute;top:10px;right:10px;background:#fff4d6;padding:4px 8px;border-radius:12px;font-size:11px;font-weight:700}.cart-fab{position:fixed;z-index:10;bottom:18px;right:50%;transform:translateX(50%);width:min(92%,600px);border:0;border-radius:18px;background:var(--dark);color:#fff;padding:15px 18px;display:flex;justify-content:space-between;box-shadow:var(--shadow)}.hidden{display:none!important}.sheet,.modal{border:0;box-shadow:var(--shadow);width:min(100%,600px);max-height:90vh;overflow:auto;padding:25px;border-radius:24px}.sheet{margin:auto auto 0}.sheet::backdrop,.modal::backdrop{background:#0008}.close{float:left;border:0;background:#eee;width:32px;height:32px;border-radius:50%;font-size:22px}.detail-img{width:100%;max-height:280px;object-fit:cover;border-radius:16px}.primary,.secondary,.danger{border:0;border-radius:10px;padding:10px 16px;text-decoration:none;display:inline-block}.primary{background:var(--brown);color:#fff}.secondary{background:var(--beige);color:var(--dark)}.danger{background:#fee4e2;color:var(--red)}.primary.small{padding:8px 12px}.qty{display:flex;align-items:center;gap:16px;margin:15px 0}.qty button{border:0;border-radius:50%;width:35px;height:35px}.total-line{display:flex;justify-content:space-between;border-top:1px solid #ddd;padding:15px 0;margin-top:10px;font-size:18px}form label{display:block;font-weight:700;margin:11px 0}form input,form textarea,form select{display:block;width:100%;margin-top:5px;padding:10px;border:1px solid #d7c8bd;border-radius:9px;background:#fff}.check{display:flex;gap:8px;align-items:center}.check input{width:auto;margin:0}.cart-row{display:grid;grid-template-columns:1fr auto;gap:10px;border-bottom:1px solid #eee;padding:12px 0}.cart-actions{display:flex;gap:8px;align-items:center}.cart-actions button{border:0;border-radius:6px}.message,.loader{text-align:center;padding:25px;color:var(--muted)}.message.error,.error{color:var(--red)}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--dark);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:50}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.admin-container{max-width:1200px;margin:auto;padding:25px}.login-card{max-width:430px;margin:7vh auto;background:#fff;padding:30px;border-radius:22px;box-shadow:var(--shadow);text-align:center}.dashboard-head,.section-head,.actions{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.stats article{background:#fff;border-radius:15px;padding:18px}.stats span{display:block;color:var(--muted)}.stats b{font-size:25px}.admin-tabs{display:flex;gap:8px;margin-bottom:18px}.pane{background:#fff;border-radius:18px;padding:18px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:680px}th,td{text-align:right;border-bottom:1px solid #eee;padding:11px}td img{width:45px;height:45px;object-fit:cover;border-radius:8px}.status-select{padding:5px}.card-form{max-width:600px}.order-items{font-size:13px;color:var(--muted)}@media(min-width:720px){.products{grid-template-columns:repeat(4,1fr)}}@media(max-width:650px){.stats{grid-template-columns:1fr}.dashboard-head{align-items:flex-start;flex-direction:column}.admin-container{padding:14px}.pane{padding:10px}}


  </style>

  <script>

  supabaseUrl: 'https://ajmymjzjmkxupbtcdwbc.supabase.co',
  // المفتاح السابق تم اختباره وكان مرفوضًا (Invalid API key).
  supabaseAnonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFqbXltanpqbWt4dXBidGNkd2JjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMDM5ODgsImV4cCI6MjEwMjY3OTk4OH0.UdwSw1hkGIPHr3xzEhGHhDTrmfPwO1DqJagBrv0Wx7A'
});

</head>
<body>
  <header class="hero">
    <a class="admin-link" href="admin.html">دخول الإدارة</a>
    <div class="logo">V</div>
    <h1>VIBES</h1>
    <p>وش مزاجك اليوم؟</p>
    <span id="storeStatus" class="status">جاري التحقق…</span>
  </header>

  <main class="container">
    <label class="search"><span>⌕</span><input id="search" type="search" placeholder="ابحث عن منتج…" autocomplete="off"></label>
    <nav id="categories" class="chips" aria-label="التصنيفات"></nav>
    <div id="message" class="message hidden" role="status"></div>
    <section id="products" class="products" aria-live="polite"><div class="loader">جاري تحميل القائمة…</div></section>
  </main>

  <button id="cartButton" class="cart-fab hidden"><span>السلة (<b id="cartCount">0</b>)</span><b id="cartTotal">0 ر.س</b></button>

  <dialog id="productDialog" class="sheet">
    <button class="close" data-close="productDialog" aria-label="إغلاق">×</button>
    <div id="productDetail"></div>
  </dialog>

  <dialog id="cartDialog" class="sheet">
    <button class="close" data-close="cartDialog" aria-label="إغلاق">×</button>
    <h2>سلة الطلب</h2>
    <div id="cartItems"></div>
    <div class="total-line"><span>الإجمالي</span><b id="dialogTotal">0 ر.س</b></div>
    <form id="checkoutForm">
      <label>الاسم<input name="customer_name" required maxlength="80"></label>
      <label>رقم الجوال<input name="customer_phone" required inputmode="tel" maxlength="20" placeholder="05xxxxxxxx"></label>
      <label>ملاحظات<textarea name="notes" maxlength="500" rows="2" placeholder="اختياري"></textarea></label>
      <button class="primary" type="submit">تأكيد الطلب وإرساله</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="alert"></div>
  <script>
(() => {
  'use strict';
  const cfg = window.VIBES_CONFIG;
  const db = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  const $ = (s) => document.querySelector(s);
  const state = { products: [], category: 'all', query: '', cart: [], settings: null, selected: null, qty: 1 };
  const categories = { all: 'الكل', popular: 'الأكثر طلبًا', coffee: 'القهوة', cold: 'المشروبات الباردة', sweets: 'الحلويات', other: 'أخرى' };
  const money = (v) => `${Number(v || 0).toFixed(2)} ر.س`;
  const esc = (v = '') => String(v).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const safeImage = (url) => /^https:\/\//i.test(url || '') ? url : '';
  function toast(text) { const t=$('#toast'); t.textContent=text; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }
  function showError(text) { const e=$('#message'); e.textContent=text; e.className='message error'; }

  async function load() {
    const [{data: products,error}, {data: settings}] = await Promise.all([
      db.from('products').select('id,name,description,price,category,image_url,popular,options').eq('active',true).order('sort_order').order('created_at'),
      db.from('store_settings').select('*').eq('id',1).maybeSingle()
    ]);
    if (error) { showError('تعذر تحميل القائمة. شغّل ملف supabase.sql وتأكد من بيانات الربط في config.js.'); return; }
    state.products=products || []; state.settings=settings;
    renderCategories(); renderProducts(); renderStatus();
  }
  function renderStatus(){
    const s=state.settings, el=$('#storeStatus');
    if(!s){el.textContent='حالة المتجر غير متاحة';el.classList.add('closed');return;}
    const hour=new Date().getHours(), within=s.open_hour < s.close_hour ? hour>=s.open_hour&&hour<s.close_hour : hour>=s.open_hour||hour<s.close_hour;
    const open=s.is_open&&within; el.textContent=open?'مفتوح الآن':'مغلق حاليًا'; el.classList.toggle('closed',!open);
  }
  function renderCategories(){
    const present=new Set(state.products.map(p=>p.category));
    $('#categories').innerHTML=Object.entries(categories).filter(([k])=>k==='all'||k==='popular'||present.has(k)).map(([k,v])=>`<button data-cat="${k}" class="${state.category===k?'active':''}">${v}</button>`).join('');
  }
  function renderProducts(){
    const q=state.query.toLocaleLowerCase('ar');
    const list=state.products.filter(p=>(state.category==='all'||(state.category==='popular'?p.popular:p.category===state.category))&&(!q||p.name.toLocaleLowerCase('ar').includes(q)||(p.description||'').toLocaleLowerCase('ar').includes(q)));
    $('#products').innerHTML=list.length?list.map(p=>`<article class="product" data-id="${p.id}">${p.popular?'<span class="badge">⭐ الأكثر طلبًا</span>':''}${safeImage(p.image_url)?`<img src="${esc(safeImage(p.image_url))}" alt="${esc(p.name)}" loading="lazy">`:'<div class="image-placeholder">☕</div>'}<div class="product-content"><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><span class="price">${money(p.price)}</span><button class="add" aria-label="إضافة">+</button></div></article>`).join(''):'<div class="message">لا توجد منتجات مطابقة.</div>';
  }
  function openProduct(p){
    state.selected=p;state.qty=1;
    $('#productDetail').innerHTML=`${safeImage(p.image_url)?`<img class="detail-img" src="${esc(safeImage(p.image_url))}" alt="${esc(p.name)}">`:''}<h2>${esc(p.name)}</h2><p>${esc(p.description)}</p><b class="price">${money(p.price)}</b><div class="qty"><button data-qty="-1">−</button><strong id="qty">1</strong><button data-qty="1">+</button></div><button id="addSelected" class="primary">إضافة للسلة • <span>${money(p.price)}</span></button>`;
    $('#productDialog').showModal();
  }
  function addSelected(){
    const p=state.selected, found=state.cart.find(i=>i.id===p.id);
    if(found) found.qty+=state.qty; else state.cart.push({id:p.id,name:p.name,price:Number(p.price),qty:state.qty});
    updateCart(); $('#productDialog').close(); toast('تمت الإضافة للسلة');
  }
  function updateCart(){
    const count=state.cart.reduce((n,i)=>n+i.qty,0), total=state.cart.reduce((n,i)=>n+i.qty*i.price,0);
    $('#cartCount').textContent=count;$('#cartTotal').textContent=money(total);$('#dialogTotal').textContent=money(total);$('#cartButton').classList.toggle('hidden',!count);
    $('#cartItems').innerHTML=state.cart.length?state.cart.map((i,n)=>`<div class="cart-row"><div><b>${esc(i.name)}</b><div class="muted">${money(i.price)}</div></div><div class="cart-actions"><button data-cart="minus" data-index="${n}">−</button><b>${i.qty}</b><button data-cart="plus" data-index="${n}">+</button><button class="danger" data-cart="remove" data-index="${n}">حذف</button></div></div>`).join(''):'<p class="muted">السلة فارغة.</p>';
  }
  async function checkout(form){
    if(!state.cart.length)return;
    if(!state.settings?.is_open){toast('المتجر لا يستقبل طلبات حاليًا');return;}
    const btn=form.querySelector('button');btn.disabled=true;btn.textContent='جاري حفظ الطلب…';
    const fd=new FormData(form), payload={p_customer_name:fd.get('customer_name').trim(),p_customer_phone:fd.get('customer_phone').trim(),p_notes:fd.get('notes').trim(),p_items:state.cart.map(i=>({product_id:i.id,quantity:i.qty}))};
    const {data,error}=await db.rpc('create_order',payload); btn.disabled=false;btn.textContent='تأكيد الطلب وإرساله';
    if(error){console.error(error);toast('تعذر حفظ الطلب، حاول مرة أخرى');return;}
    const orderNo=data?.order_number || data?.[0]?.order_number || data;
    let text=`طلب جديد من Vibes رقم ${orderNo}\nالاسم: ${payload.p_customer_name}\nالجوال: ${payload.p_customer_phone}\n\n`;
    state.cart.forEach(i=>text+=`${i.name} × ${i.qty} — ${money(i.price*i.qty)}\n`);text+=`\nالإجمالي: ${$('#dialogTotal').textContent}`;if(payload.p_notes)text+=`\nملاحظات: ${payload.p_notes}`;
    state.cart=[];updateCart();form.reset();$('#cartDialog').close();
    toast(`تم تسجيل الطلب رقم ${orderNo}`);
    const phone=(state.settings.whatsapp_number||'').replace(/\D/g,''); if(phone) window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`,'_blank','noopener');
  }
  $('#search').addEventListener('input',e=>{state.query=e.target.value;renderProducts()});
  $('#categories').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;state.category=b.dataset.cat;renderCategories();renderProducts()});
  $('#products').addEventListener('click',e=>{const c=e.target.closest('[data-id]');if(c)openProduct(state.products.find(p=>p.id===c.dataset.id))});
  $('#productDetail').addEventListener('click',e=>{if(e.target.closest('[data-qty]')){state.qty=Math.max(1,state.qty+Number(e.target.closest('[data-qty]').dataset.qty));$('#qty').textContent=state.qty;$('#addSelected span').textContent=money(state.selected.price*state.qty)}if(e.target.closest('#addSelected'))addSelected()});
  $('#cartButton').addEventListener('click',()=>{$('#cartDialog').showModal();updateCart()});
  $('#cartItems').addEventListener('click',e=>{const b=e.target.closest('[data-cart]');if(!b)return;const i=state.cart[Number(b.dataset.index)];if(b.dataset.cart==='plus')i.qty++;if(b.dataset.cart==='minus')i.qty--;if(b.dataset.cart==='remove'||i.qty<1)state.cart.splice(Number(b.dataset.index),1);updateCart()});
  $('#checkoutForm').addEventListener('submit',e=>{e.preventDefault();checkout(e.currentTarget)});
  document.addEventListener('click',e=>{const b=e.target.closest('[data-close]');if(b)document.getElementById(b.dataset.close).close()});
  load();
})();


  </script>
</body>
</html>
