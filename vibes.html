<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibes ☕ Specialty Coffee</title>
  <meta name="description" content="Vibes Specialty Coffee – قهوة مختصة، حلويات، ومشروبات باردة. طلب سريع عبر واتساب.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;800;900&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
  <style>
    /* ===== CSS Variables ===== */
    :root {
      --primary: #795239;
      --primary-dark: #5A3A2A;
      --primary-light: #A67C5B;
      --cream: #F6F2ED;
      --beige: #EAE0D5;
      --white: #FFFFFF;
      --text: #2D1F16;
      --text-light: #7A6A5D;
      --radius-sm: 10px;
      --radius-md: 18px;
      --radius-lg: 24px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
      --shadow-md: 0 6px 20px rgba(0,0,0,0.08);
      --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
      --font-ar: 'Tajawal', sans-serif;
      --font-amiri: 'Amiri', serif;
      --font-en: 'Montserrat', sans-serif;
      --transition: 0.25s ease;
    }

    /* ===== Reset & Base ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-ar);
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
      padding-bottom: 92px;
    }

    /* ===== Header ===== */
    .header {
      text-align: center;
      padding: 22px 16px 14px;
      background: var(--white);
      border-bottom: 1px solid rgba(0,0,0,.05);
    }

    .logo-area {
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .logo-img {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 2px 8px rgba(121,82,57,.2);
    }

    .brand-name {
      font-family: var(--font-en);
      font-size: 1.9rem;
      font-weight: 900;
      color: var(--primary);
      letter-spacing: 2px;
      line-height: 1;
    }
    .brand-name span {
      display: block;
      margin-top: 6px;
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--text-light);
    }

    .welcome {
      margin-top: 12px;
      font-family: var(--font-amiri);
      font-size: 1.08rem;
      color: var(--primary);
    }

    .status-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: .75rem;
      font-weight: 700;
      background: #E8F5E9;
      color: #2E7D32;
      transition: background .3s, color .3s;
    }
    .status-badge.closed {
      background: #FFEBEE;
      color: #C62828;
    }

    /* ===== Search ===== */
    .search-container {
      max-width: 800px;
      margin: 14px auto 8px;
      padding: 0 16px;
    }
    .search-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(121,82,57,.16);
      border-radius: 999px;
      font-family: var(--font-ar);
      background: #fff;
      outline: none;
      transition: border-color .3s, box-shadow .3s;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(121,82,57,.08);
    }

    /* ===== Tabs ===== */
    .tabs-container {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 16px 12px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .tabs-container::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 0 0 auto;
      padding: 8px 17px;
      border: none;
      border-radius: 999px;
      background: var(--beige);
      color: var(--text-light);
      font-family: var(--font-ar);
      font-weight: 700;
      cursor: pointer;
      transition: background .25s, color .25s;
      white-space: nowrap;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
    }
    .tab-btn:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    /* ===== Products Grid ===== */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 14px 16px 24px;
      max-width: 980px;
      margin: auto;
    }

    .product-card {
      background: #fff;
      border: 1px solid rgba(121,82,57,.09);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      position: relative;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }
    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }
    .product-card:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .card-image {
      width: 100%;
      aspect-ratio: 1/1;
      background: var(--beige);
      overflow: hidden;
      display: grid;
      place-items: center;
    }
    .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .placeholder {
      color: var(--primary-light);
    }

    .card-body {
      padding: 12px;
      position: relative;
      min-height: 110px;
    }
    .product-name {
      font-size: 15px;
      font-weight: 800;
      padding-left: 38px;
    }
    .product-desc {
      margin-top: 3px;
      color: var(--text-light);
      font-size: .79rem;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 38px;
    }
    .product-price {
      margin-top: 7px;
      color: var(--primary);
      font-weight: 900;
    }
    .quick-add {
      position: absolute;
      left: 10px;
      bottom: 10px;
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      font-size: 1.25rem;
      font-weight: 700;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background .2s, transform .15s;
    }
    .quick-add:hover {
      background: var(--primary-dark);
      transform: scale(1.05);
    }
    .quick-add:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .product-popular-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #FFD54F;
      color: #5D4037;
      font-size: .6rem;
      font-weight: 800;
      padding: 2px 10px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    /* ===== Cart Bar ===== */
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      box-shadow: 0 -4px 20px rgba(0,0,0,.08);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-top: 1px solid rgba(0,0,0,.04);
    }
    .cart-bar.show {
      display: flex;
    }
    .cart-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      flex-wrap: wrap;
    }
    .cart-count {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--primary);
      color: #fff;
      font-size: .8rem;
    }
    .cart-total {
      color: var(--primary);
      font-weight: 900;
    }
    .cart-btn {
      border: none;
      border-radius: 999px;
      background: var(--primary);
      color: #fff;
      padding: 10px 20px;
      font-family: var(--font-ar);
      font-weight: 800;
      cursor: pointer;
      transition: background .2s;
    }
    .cart-btn:hover {
      background: var(--primary-dark);
    }
    .cart-btn:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    /* ===== Sheets ===== */
    .sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.48);
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: opacity .25s, visibility .25s;
      backdrop-filter: blur(2px);
    }
    .sheet-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: #fff;
      border-radius: 24px 24px 0 0;
      padding: 14px 18px calc(26px + env(safe-area-inset-bottom));
      max-height: 90vh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform .3s cubic-bezier(.4,0,.2,1);
      box-shadow: 0 -12px 40px rgba(0,0,0,.18);
    }
    .sheet-overlay.active .sheet {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 42px;
      height: 4px;
      border-radius: 999px;
      background: #ddd;
      margin: 0 auto 12px;
      flex-shrink: 0;
    }

    .sheet-close {
      position: absolute;
      top: 14px;
      left: 16px;
      border: none;
      background: transparent;
      font-size: 1.2rem;
      color: var(--text-light);
      cursor: pointer;
      padding: 8px;
      line-height: 1;
      border-radius: 50%;
      transition: background .2s;
    }
    .sheet-close:hover {
      background: rgba(0,0,0,.05);
    }
    .sheet-close:focus-visible {
      outline: 2px solid var(--primary);
    }

    .detail-image {
      width: 100%;
      aspect-ratio: 16/10;
      border-radius: 18px;
      background: var(--beige);
      overflow: hidden;
      margin-bottom: 14px;
      display: grid;
      place-items: center;
    }
    .detail-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .sheet h3 {
      font-size: 1.25rem;
      font-weight: 900;
      margin-bottom: 4px;
    }
    .sheet-price {
      color: var(--primary);
      font-weight: 900;
      margin-bottom: 14px;
      font-size: 1.1rem;
    }

    .option-group {
      margin-bottom: 16px;
    }
    .option-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
      font-size: .88rem;
      color: var(--text-light);
    }
    .option-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .option-btn {
      border: 1px solid var(--beige);
      background: var(--cream);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 14px;
      font-family: var(--font-ar);
      cursor: pointer;
      transition: background .2s, border-color .2s, color .2s;
    }
    .option-btn.selected {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .option-btn:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .quantity-control {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .qty-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--beige);
      background: var(--cream);
      font-size: 1.2rem;
      cursor: pointer;
      transition: background .2s;
      display: grid;
      place-items: center;
    }
    .qty-btn:hover {
      background: var(--beige);
    }
    .qty-btn:focus-visible {
      outline: 2px solid var(--primary);
    }
    .qty-value {
      min-width: 28px;
      text-align: center;
      font-weight: 800;
    }

    .add-to-cart-btn {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 14px;
      background: var(--primary);
      color: #fff;
      font-family: var(--font-ar);
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      transition: background .2s;
    }
    .add-to-cart-btn:hover {
      background: var(--primary-dark);
    }
    .add-to-cart-btn:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    /* Cart sheet */
    .cart-items-list {
      max-height: 260px;
      overflow-y: auto;
      margin-bottom: 12px;
    }
    .cart-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }
    .item-name {
      font-weight: 800;
    }
    .item-details {
      font-size: .78rem;
      color: var(--text-light);
      margin-top: 2px;
    }
    .item-right {
      text-align: left;
    }
    .item-price {
      color: var(--primary);
      font-weight: 900;
    }
    .item-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 7px;
      justify-content: flex-end;
    }
    .mini-btn {
      width: 26px;
      height: 26px;
      border: 1px solid var(--beige);
      background: var(--cream);
      border-radius: 50%;
      cursor: pointer;
      font-weight: 800;
      transition: background .2s;
      display: grid;
      place-items: center;
    }
    .mini-btn:hover {
      background: var(--beige);
    }
    .mini-btn:focus-visible {
      outline: 2px solid var(--primary);
    }
    .remove-btn {
      border: none;
      background: transparent;
      color: #C0392B;
      cursor: pointer;
      font-family: var(--font-ar);
      font-size: .78rem;
      padding: 2px 4px;
    }
    .remove-btn:hover {
      text-decoration: underline;
    }

    .cart-total-row {
      display: flex;
      justify-content: space-between;
      font-size: 1.12rem;
      font-weight: 900;
      padding: 12px 0;
      border-top: 2px solid var(--primary);
      margin-top: 4px;
    }

    .whatsapp-send-btn,
    .clear-cart-btn {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 15px;
      font-family: var(--font-ar);
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      transition: background .2s;
      margin-top: 8px;
    }
    .whatsapp-send-btn {
      background: #25D366;
      color: #fff;
    }
    .whatsapp-send-btn:hover {
      background: #1DA851;
    }
    .clear-cart-btn {
      background: #eee;
      color: var(--text-light);
    }
    .clear-cart-btn:hover {
      background: #ddd;
    }

    /* ===== Social ===== */
    .social-section {
      max-width: 980px;
      margin: 8px auto 22px;
      padding: 0 16px;
      text-align: center;
    }
    .social-title {
      font-family: var(--font-amiri);
      font-size: 1.05rem;
      color: var(--primary);
      margin-bottom: 10px;
    }
    .social-links {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .social-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--primary);
      background: #fff;
      border: 1px solid rgba(121,82,57,.12);
      border-radius: 999px;
      padding: 9px 14px;
      font-weight: 800;
      box-shadow: var(--shadow-sm);
      transition: background .2s, box-shadow .2s;
    }
    .social-link:hover {
      background: var(--cream);
      box-shadow: var(--shadow-md);
    }
    .social-link svg {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
    }

    /* ===== Empty state ===== */
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 42px 10px;
      color: var(--text-light);
    }

    /* ===== Responsive ===== */
    @media (min-width: 600px) {
      .products-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .sheet {
        max-width: 560px;
        left: 50%;
        right: auto;
        width: 100%;
        transform: translate(-50%, 100%);
      }
      .sheet-overlay.active .sheet {
        transform: translate(-50%, 0);
      }
    }

    @media (min-width: 900px) {
      .products-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    /* ===== Utility ===== */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      border: 0;
    }

    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: #323232;
      color: #fff;
      padding: 10px 24px;
      border-radius: 999px;
      font-weight: 700;
      box-shadow: var(--shadow-lg);
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: opacity .3s, visibility .3s;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      visibility: visible;
    }
  </style>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="logo-area">
      <div class="logo-img" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="#fff">
          <path d="M2 21h18v-2H2v2zM20 8h-2V5h2m-4 0H4v6c0 2.21 1.79 4 4 4h6c2.21 0 4-1.79 4-4V5z"/>
        </svg>
      </div>
      <div class="brand-name">VIBES<span>SPECIALTY COFFEE</span></div>
    </div>
    <div class="welcome">وش مزاجك اليوم؟</div>
    <div class="status-badge" id="statusBadge" aria-live="polite">مفتوح الآن</div>
  </header>

  <!-- ===== SEARCH ===== -->
  <div class="search-container">
    <label for="searchInput" class="sr-only">ابحث عن منتج</label>
    <input type="text" class="search-input" id="searchInput" placeholder="ابحث عن منتج..." aria-label="بحث">
  </div>

  <!-- ===== TABS ===== -->
  <nav class="tabs-container" id="tabsContainer" aria-label="تصفية المنتجات">
    <button class="tab-btn active" data-category="all" aria-current="true">الكل</button>
    <button class="tab-btn" data-category="popular">الأكثر طلبًا</button>
    <button class="tab-btn" data-category="coffee">القهوة</button>
    <button class="tab-btn" data-category="cold">المشروبات الباردة</button>
    <button class="tab-btn" data-category="sweets">الحلويات</button>
  </nav>

  <!-- ===== PRODUCTS ===== -->
  <main class="products-grid" id="productsGrid" role="list"></main>

  <!-- ===== SOCIAL ===== -->
  <section class="social-section" aria-label="حسابات التواصل الاجتماعي">
    <div class="social-title">تابعونا على حسابات VIBES</div>
    <div class="social-links">
      <a class="social-link" href="https://www.instagram.com/vibes.espresso" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle cx="17.5" cy="6.5" r="1"></circle>
        </svg>
        <span>Instagram @vibes.espresso</span>
      </a>
      <a class="social-link" href="https://www.tiktok.com/@vibes.espresso" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M14 3v10.1a3.6 3.6 0 1 1-3-3.55V7.1a6 6 0 1 0 5.5 5.98V8.65c1.15.82 2.55 1.3 4.05 1.3V7.5A4.55 4.55 0 0 1 16.5 3H14z"/>
        </svg>
        <span>TikTok @vibes.espresso</span>
      </a>
    </div>
  </section>

  <!-- ===== CART BAR ===== -->
  <div class="cart-bar" id="cartBar" role="toolbar" aria-label="سلة المشتريات">
    <div class="cart-info">
      <span class="cart-count" id="cartCount" aria-label="عدد المنتجات">0</span>
      <span>سلتك</span>
      <span class="cart-total" id="cartTotal">0 ر.س</span>
    </div>
    <button class="cart-btn" id="openCartBtn">عرض السلة</button>
  </div>

  <!-- ===== TOAST ===== -->
  <div class="toast" id="toast" role="alert" aria-live="assertive"></div>

  <!-- ===== PRODUCT DETAIL SHEET ===== -->
  <div class="sheet-overlay" id="productSheetOverlay" role="dialog" aria-modal="true" aria-labelledby="sheetProductName">
    <div class="sheet" id="productSheet">
      <div class="sheet-handle" aria-hidden="true"></div>
      <button class="sheet-close" id="closeProductSheet" aria-label="إغلاق">✕</button>
      <div class="detail-image" id="detailImage" aria-hidden="true"></div>
      <h3 id="sheetProductName"></h3>
      <div class="sheet-price" id="sheetPrice"></div>
      <div id="dynamicOptions"></div>
      <div class="option-group">
        <label for="qtyValue">الكمية</label>
        <div class="quantity-control">
          <button class="qty-btn" id="qtyMinus" aria-label="إنقاص الكمية">−</button>
          <span class="qty-value" id="qtyValue" aria-live="polite">1</span>
          <button class="qty-btn" id="qtyPlus" aria-label="زيادة الكمية">+</button>
        </div>
      </div>
      <button class="add-to-cart-btn" id="addToCartBtn">إضافة للسلة</button>
    </div>
  </div>

  <!-- ===== CART SHEET ===== -->
  <div class="sheet-overlay" id="cartSheetOverlay" role="dialog" aria-modal="true" aria-label="سلة الطلب">
    <div class="sheet">
      <div class="sheet-handle" aria-hidden="true"></div>
      <button class="sheet-close" id="closeCartSheet" aria-label="إغلاق السلة">✕</button>
      <h3>سلة الطلب</h3>
      <div class="cart-items-list" id="cartItemsList" role="list"></div>
      <div class="cart-total-row">
        <span>الإجمالي</span>
        <span id="cartSheetTotal">0 ر.س</span>
      </div>
      <button class="whatsapp-send-btn" id="sendWhatsAppBtn">إرسال الطلب عبر واتساب</button>
      <button class="clear-cart-btn" id="clearCartBtn">مسح السلة</button>
    </div>
  </div>

  <script>
    // ============================================================
    //  CONFIGURATION
    // ============================================================
    const CONFIG = {
      supabaseUrl: 'https://lqdgqyhagpzzeelwfcyn.supabase.co',
      supabaseAnonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxxZGdxeWhhZ3B6emVlbHdmY3luIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDI0MjA1ODMsImV4cCI6MjA1Nzk5NjU4M30.3X1tG2YrWq9OK6nzjfHkxZc_9WJkLxvX1p3J5L6A8cE',
      whatsappNumber: '966500000000',
    };

    // ============================================================
    //  SUPABASE CLIENT
    // ============================================================
    const supabase = window.supabase.createClient(
      CONFIG.supabaseUrl,
      CONFIG.supabaseAnonKey
    );

    // ============================================================
    //  STATE
    // ============================================================
    const STATE = {
      products: [],
      currentCategory: 'all',
      searchQuery: '',
      currentProduct: null,
      currentQty: 1,
      selectedOptions: {},
      cart: [],
    };

    // ============================================================
    //  DOM REFS
    // ============================================================
    const $ = (sel, ctx = document) => ctx.querySelector(sel);
    const $$ = (sel, ctx = document) => [...ctx.querySelectorAll(sel)];

    const els = {
      productsGrid: $('#productsGrid'),
      searchInput: $('#searchInput'),
      tabsContainer: $('#tabsContainer'),
      statusBadge: $('#statusBadge'),

      productOverlay: $('#productSheetOverlay'),
      closeProduct: $('#closeProductSheet'),
      detailImage: $('#detailImage'),
      sheetName: $('#sheetProductName'),
      sheetPrice: $('#sheetPrice'),
      dynamicOptions: $('#dynamicOptions'),
      qtyMinus: $('#qtyMinus'),
      qtyPlus: $('#qtyPlus'),
      qtyValue: $('#qtyValue'),
      addToCartBtn: $('#addToCartBtn'),

      cartBar: $('#cartBar'),
      cartCount: $('#cartCount'),
      cartTotal: $('#cartTotal'),
      openCartBtn: $('#openCartBtn'),

      cartOverlay: $('#cartSheetOverlay'),
      closeCart: $('#closeCartSheet'),
      cartItemsList: $('#cartItemsList'),
      cartSheetTotal: $('#cartSheetTotal'),
      sendWhatsApp: $('#sendWhatsAppBtn'),
      clearCartBtn: $('#clearCartBtn'),

      toast: $('#toast'),
    };

    // ============================================================
    //  UTILITY FUNCTIONS
    // ============================================================
    const fmt = (n) => `${Number(n).toFixed(2)} ر.س`;

    function escapeHtml(str) {
      if (!str) return '';
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return str.replace(/[&<>"']/g, (m) => map[m]);
    }

    function placeholderSVG() {
      return `<div class="placeholder" aria-hidden="true">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="#A67C5B">
          <path d="M2 21h18v-2H2v2zM20 8h-2V5h2m-4 0H4v6c0 2.21 1.79 4 4 4h6c2.21 0 4-1.79 4-4V5z"/>
        </svg>
      </div>`;
    }

    function showToast(text) {
      const el = els.toast;
      el.textContent = text;
      el.classList.add('show');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
    }

    function setStatus() {
      const h = new Date().getHours();
      const open = h >= 8 && h < 23;
      els.statusBadge.textContent = open ? 'مفتوح الآن' : 'مغلق';
      els.statusBadge.classList.toggle('closed', !open);
    }

    // ============================================================
    //  FETCH PRODUCTS
    // ============================================================
    async function fetchProducts() {
      try {
        const { data, error } = await supabase
          .from('products')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;
        STATE.products = data || [];
        renderProducts();
      } catch (err) {
        console.error('Supabase fetch error:', err);
        showToast('⚠️ فشل تحميل المنتجات');
        STATE.products = [];
        renderProducts();
      }
    }

    // ============================================================
    //  RENDER PRODUCTS
    // ============================================================
    function renderProducts() {
      const filtered = STATE.products.filter((p) => {
        const catOk =
          STATE.currentCategory === 'all' ||
          (STATE.currentCategory === 'popular' ? p.popular : p.category === STATE.currentCategory);
        const q = STATE.searchQuery.trim().toLowerCase();
        const searchOk = !q || p.name.toLowerCase().includes(q) || (p.description || '').toLowerCase().includes(q);
        return catOk && searchOk;
      });

      if (!filtered.length) {
        els.productsGrid.innerHTML = `<div class="empty">ما لقينا منتج مطابق.</div>`;
        return;
      }

      els.productsGrid.innerHTML = filtered
        .map((p) => {
          const imgHtml = p.image_url ?
            `<img src="${p.image_url}" alt="${escapeHtml(p.name)}" loading="lazy" onerror="this.parentElement.innerHTML='${placeholderSVG()}'">` :
            placeholderSVG();
          const popularBadge = p.popular ?
            `<span class="product-popular-badge">⭐ الأكثر طلبًا</span>` :
            '';
          return `
            <article class="product-card" data-id="${p.id}" role="listitem">
              <div class="card-image">${imgHtml}</div>
              <div class="card-body">
                ${popularBadge}
                <div class="product-name">${escapeHtml(p.name)}</div>
                <div class="product-desc">${escapeHtml(p.description)}</div>
                <div class="product-price">${fmt(p.price)}</div>
                <button class="quick-add" data-id="${p.id}" aria-label="إضافة ${escapeHtml(p.name)}">+</button>
              </div>
            </article>
          `;
        })
        .join('');
    }

    // ============================================================
    //  OPTIONS BUILDER
    // ============================================================
    const optionLabels = {
      temperature: { hot: 'ساخن', cold: 'بارد' },
      milk: { regular: 'حليب عادي', oat: 'حليب شوفان', almond: 'حليب لوز' },
      extraShot: { no: 'بدون شوت إضافي', single: 'شوت إضافي', double: 'شوتين إضافيين' },
    };

    function buildOptions(product) {
      STATE.selectedOptions = {};
      const blocks = [];
      const opts = product.options || {};

      if (opts.temperature) {
        STATE.selectedOptions.temperature = 'hot';
        blocks.push(`
          <div class="option-group">
            <label>درجة الحرارة</label>
            <div class="option-buttons" data-option="temperature">
              <button class="option-btn selected" data-value="hot" data-price="0">ساخن</button>
              <button class="option-btn" data-value="cold" data-price="0">بارد</button>
            </div>
          </div>
        `);
      }

      if (opts.milk) {
        STATE.selectedOptions.milk = 'regular';
        blocks.push(`
          <div class="option-group">
            <label>نوع الحليب</label>
            <div class="option-buttons" data-option="milk">
              <button class="option-btn selected" data-value="regular" data-price="0">عادي</button>
              <button class="option-btn" data-value="oat" data-price="3">شوفان (+3)</button>
              <button class="option-btn" data-value="almond" data-price="3">لوز (+3)</button>
            </div>
          </div>
        `);
      }

      if (opts.extraShot) {
        STATE.selectedOptions.extraShot = 'no';
        blocks.push(`
          <div class="option-group">
            <label>Extra Shot</label>
            <div class="option-buttons" data-option="extraShot">
              <button class="option-btn selected" data-value="no" data-price="0">بدون</button>
              <button class="option-btn" data-value="single" data-price="5">شوت (+5)</button>
              <button class="option-btn" data-value="double" data-price="10">شوتين (+10)</button>
            </div>
          </div>
        `);
      }

      els.dynamicOptions.innerHTML = blocks.join('');
      // Bind option clicks
      els.dynamicOptions.querySelectorAll('.option-btn').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          const group = btn.closest('.option-buttons');
          const key = group.dataset.option;
          group.querySelectorAll('.option-btn').forEach((b) => b.classList.remove('selected'));
          btn.classList.add('selected');
          STATE.selectedOptions[key] = btn.dataset.value;
          updateSheetPrice();
        });
      });
    }

    // ============================================================
    //  CALCULATE UNIT PRICE
    // ============================================================
    function calcUnitPrice() {
      if (!STATE.currentProduct) return 0;
      let price = STATE.currentProduct.price;

      const milkSelected = els.dynamicOptions.querySelector('[data-option="milk"] .selected');
      const shotSelected = els.dynamicOptions.querySelector('[data-option="extraShot"] .selected');

      if (milkSelected) price += Number(milkSelected.dataset.price || 0);
      if (shotSelected) price += Number(shotSelected.dataset.price || 0);

      return price;
    }

    function updateSheetPrice() {
      const unit = calcUnitPrice();
      els.sheetPrice.textContent = fmt(unit);
      els.addToCartBtn.textContent = `إضافة للسلة • ${fmt(unit * STATE.currentQty)}`;
    }

    // ============================================================
    //  OPEN / CLOSE PRODUCT SHEET
    // ============================================================
    function openProduct(product) {
      STATE.currentProduct = product;
      STATE.currentQty = 1;
      els.qtyValue.textContent = '1';

      els.sheetName.textContent = product.name;
      els.detailImage.innerHTML = product.image_url ?
        `<img src="${product.image_url}" alt="${escapeHtml(product.name)}" loading="lazy" onerror="this.parentElement.innerHTML='${placeholderSVG()}'">` :
        placeholderSVG();

      buildOptions(product);
      updateSheetPrice();
      els.productOverlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeProduct() {
      els.productOverlay.classList.remove('active');
      document.body.style.overflow = '';
      STATE.currentProduct = null;
    }

    // ============================================================
    //  CART OPERATIONS
    // ============================================================
    function addToCart() {
      if (!STATE.currentProduct) return;

      const unitPrice = calcUnitPrice();
      const signature = JSON.stringify({
        id: STATE.currentProduct.id,
        options: STATE.selectedOptions,
      });

      const existing = STATE.cart.find((item) => item.signature === signature);
      if (existing) {
        existing.qty += STATE.currentQty;
        existing.totalPrice = existing.qty * existing.unitPrice;
      } else {
        STATE.cart.push({
          signature,
          product: STATE.currentProduct,
          options: { ...STATE.selectedOptions },
          qty: STATE.currentQty,
          unitPrice,
          totalPrice: unitPrice * STATE.currentQty,
        });
      }

      updateCartUI();
      showToast('تمت الإضافة للسلة ✅');
      closeProduct();
    }

    function updateCartUI() {
      const count = STATE.cart.reduce((s, i) => s + i.qty, 0);
      const total = STATE.cart.reduce((s, i) => s + i.totalPrice, 0);
      els.cartCount.textContent = count;
      els.cartTotal.textContent = fmt(total);
      els.cartBar.classList.toggle('show', count > 0);
      renderCartSheet();
    }

    function renderCartSheet() {
      if (!STATE.cart.length) {
        els.cartItemsList.innerHTML = `<div class="empty">السلة فاضية.</div>`;
        els.cartSheetTotal.textContent = '0 ر.س';
        return;
      }

      let html = '';
      STATE.cart.forEach((item, index) => {
        const details = Object.entries(item.options)
          .filter(([k, v]) => !(k === 'extraShot' && v === 'no'))
          .map(([k, v]) => (optionLabels[k] ? optionLabels[k][v] : v))
          .join(' • ');

        html += `
          <div class="cart-item" role="listitem">
            <div>
              <div class="item-name">${escapeHtml(item.product.name)}</div>
              ${details ? `<div class="item-details">${escapeHtml(details)}</div>` : ''}
              <button class="remove-btn" data-action="remove" data-index="${index}">حذف</button>
            </div>
            <div class="item-right">
              <div class="item-price">${fmt(item.totalPrice)}</div>
              <div class="item-actions">
                <button class="mini-btn" data-action="minus" data-index="${index}" aria-label="إنقاص">−</button>
                <strong>${item.qty}</strong>
                <button class="mini-btn" data-action="plus" data-index="${index}" aria-label="زيادة">+</button>
              </div>
            </div>
          </div>
        `;
      });

      els.cartItemsList.innerHTML = html;
      const total = STATE.cart.reduce((s, i) => s + i.totalPrice, 0);
      els.cartSheetTotal.textContent = fmt(total);
    }

    function clearCart() {
      if (STATE.cart.length === 0) return;
      if (confirm('هل أنت متأكد من مسح السلة؟')) {
        STATE.cart = [];
        updateCartUI();
        showToast('تم مسح السلة');
      }
    }

    // ============================================================
    //  WHATSAPP SEND
    // ============================================================
    function sendWhatsApp() {
      if (!STATE.cart.length) return;

      let msg = 'مرحباً، أود طلب التالي من Vibes:\n\n';
      STATE.cart.forEach((item, i) => {
        const details = Object.entries(item.options)
          .filter(([k, v]) => !(k === 'extraShot' && v === 'no'))
          .map(([k, v]) => (optionLabels[k] ? optionLabels[k][v] : v));

        msg += `${i+1}. ${item.product.name} × ${item.qty}\n`;
        if (details.length) msg += `   ${details.join(' • ')}\n`;
        msg += `   ${fmt(item.totalPrice)}\n\n`;
      });
      msg += `الإجمالي: ${fmt(STATE.cart.reduce((s, i) => s + i.totalPrice, 0))}`;

      window.open(`https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    // ============================================================
    //  EVENT BINDING
    // ============================================================
    function init() {
      // Load products
      fetchProducts();
      setStatus();

      // ---- Search ----
      els.searchInput.addEventListener('input', (e) => {
        STATE.searchQuery = e.target.value;
        renderProducts();
      });

      // ---- Tabs ----
      els.tabsContainer.addEventListener('click', (e) => {
        const btn = e.target.closest('.tab-btn');
        if (!btn) return;
        STATE.currentCategory = btn.dataset.category;
        els.tabsContainer.querySelectorAll('.tab-btn').forEach((b) => {
          b.classList.remove('active');
          b.removeAttribute('aria-current');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-current', 'true');
        renderProducts();
      });

      // ---- Product click (open sheet) ----
      els.productsGrid.addEventListener('click', (e) => {
        const addBtn = e.target.closest('.quick-add');
        if (addBtn) {
          e.stopPropagation();
          const p = STATE.products.find((x) => x.id === addBtn.dataset.id);
          if (p) openProduct(p);
          return;
        }
        const card = e.target.closest('.product-card');
        if (!card) return;
        const p = STATE.products.find((x) => x.id === card.dataset.id);
        if (p) openProduct(p);
      });

      // ---- Options (handled by dynamic listeners) ----

      // ---- Quantity ----
      els.qtyMinus.addEventListener('click', () => {
        STATE.currentQty = Math.max(1, STATE.currentQty - 1);
        els.qtyValue.textContent = STATE.currentQty;
        updateSheetPrice();
      });
      els.qtyPlus.addEventListener('click', () => {
        STATE.currentQty++;
        els.qtyValue.textContent = STATE.currentQty;
        updateSheetPrice();
      });

      // ---- Add to cart ----
      els.addToCartBtn.addEventListener('click', addToCart);

      // ---- Close product sheet ----
      els.productOverlay.addEventListener('click', (e) => {
        if (e.target === els.productOverlay) closeProduct();
      });
      els.closeProduct.addEventListener('click', closeProduct);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && els.productOverlay.classList.contains('active')) closeProduct();
      });

      // ---- Open cart sheet ----
      els.openCartBtn.addEventListener('click', () => {
        renderCartSheet();
        els.cartOverlay.classList.add('active');
        document.body.style.overflow = 'hidden';
      });

      // ---- Close cart sheet ----
      els.cartOverlay.addEventListener('click', (e) => {
        if (e.target === els.cartOverlay) {
          els.cartOverlay.classList.remove('active');
          document.body.style.overflow = '';
        }
      });
      els.closeCart.addEventListener('click', () => {
        els.cartOverlay.classList.remove('active');
        document.body.style.overflow = '';
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && els.cartOverlay.classList.contains('active')) {
          els.cartOverlay.classList.remove('active');
          document.body.style.overflow = '';
        }
      });

      // ---- Cart item actions ----
      els.cartItemsList.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const idx = Number(btn.dataset.index);
        const action = btn.dataset.action;

        if (action === 'plus') STATE.cart[idx].qty++;
        if (action === 'minus') STATE.cart[idx].qty--;
        if (action === 'remove' || STATE.cart[idx].qty <= 0) STATE.cart.splice(idx, 1);

        STATE.cart.forEach((item) => (item.totalPrice = item.qty * item.unitPrice));
        updateCartUI();
      });

      // ---- Clear cart ----
      els.clearCartBtn.addEventListener('click', clearCart);

      // ---- Send WhatsApp ----
      els.sendWhatsApp.addEventListener('click', sendWhatsApp);

      // ---- Keyboard support for product cards ----
      els.productsGrid.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          const card = e.target.closest('.product-card');
          if (card) {
            e.preventDefault();
            const p = STATE.products.find((x) => x.id === card.dataset.id);
            if (p) openProduct(p);
          }
        }
      });

      // ---- Auto-refresh products every 30 seconds ----
      setInterval(fetchProducts, 30000);
    }

    // ============================================================
    //  START
    // ============================================================
    document.addEventListener('DOMContentLoaded', init);
  </script>

</body>
</html>
