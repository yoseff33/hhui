<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Vibes Specialty Coffee - اطلب مباشرة من القائمة">
  <title>Vibes | القائمة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js" defer></script>
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="hero">
    <a class="admin-link" href="admin.html">دخول الإدارة</a>
    <div class="logo">V</div>
    <h1>VIBES</h1>
    <p>وش مزاجك اليوم؟</p>
    <span id="storeStatus" class="status">جاري التحقق…</span>
  </header>

  <main class="container">
    <label class="search"><span>⌕</span><input id="search" type="search" placeholder="ابحث عن منتج…" autocomplete="off"></label>
    <nav id="categories" class="chips" aria-label="التصنيفات"></nav>
    <div id="message" class="message hidden" role="status"></div>
    <section id="products" class="products" aria-live="polite"><div class="loader">جاري تحميل القائمة…</div></section>
  </main>

  <button id="cartButton" class="cart-fab hidden"><span>السلة (<b id="cartCount">0</b>)</span><b id="cartTotal">0 ر.س</b></button>

  <dialog id="productDialog" class="sheet">
    <button class="close" data-close="productDialog" aria-label="إغلاق">×</button>
    <div id="productDetail"></div>
  </dialog>

  <dialog id="cartDialog" class="sheet">
    <button class="close" data-close="cartDialog" aria-label="إغلاق">×</button>
    <h2>سلة الطلب</h2>
    <div id="cartItems"></div>
    <div class="total-line"><span>الإجمالي</span><b id="dialogTotal">0 ر.س</b></div>
    <form id="checkoutForm">
      <label>الاسم<input name="customer_name" required maxlength="80"></label>
      <label>رقم الجوال<input name="customer_phone" required inputmode="tel" maxlength="20" placeholder="05xxxxxxxx"></label>
      <label>ملاحظات<textarea name="notes" maxlength="500" rows="2" placeholder="اختياري"></textarea></label>
      <button class="primary" type="submit">تأكيد الطلب وإرساله</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="alert"></div>
</body>
</html>
